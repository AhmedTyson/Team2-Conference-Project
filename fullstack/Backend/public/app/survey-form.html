<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Survey · Travel Planner</title>
  <link rel="stylesheet" href="../assets/css/tokens.css" />
  <link rel="stylesheet" href="../assets/css/app.css" />
  <script>/* FOUC prevention — default dark */
    (function(){var k="itinari_theme",s;try{s=localStorage.getItem(k);}catch(e){}
    if(!s||s==="dark"||(s==="system"&&window.matchMedia&&window.matchMedia("(prefers-color-scheme:dark)").matches))
      document.documentElement.classList.add("dark","fouc-ready");
    else document.documentElement.classList.add("fouc-ready");
    })();
  </script></head>
<body data-page="surveys" class="is-booting" data-layout="app">
  <div class="app">
    <header class="app__header">
      <a id="app-brand" class="app__brand" href="/home.html"></a>
      <nav id="app-nav" class="nav" aria-label="Main navigation"></nav>
      <div id="app-user" class="app__user">
        <button id="theme-toggle" type="button" class="btn btn--ghost" aria-label="Toggle theme">◐</button>
      </div>
    </header>

    <main class="app__main">
      <div class="page">
        <header class="page-header">
          <p class="page-header__eyebrow" id="form-eyebrow">Your Profile</p>
          <h1 class="page-header__title" id="form-title">New survey</h1>
          <p class="page-header__lead">Three quick questions shape how we plan with you.</p>
        </header>

        <form class="form" id="survey-form" novalidate>
          <div class="field">
            <span class="field__label">Travel style</span>
            <div class="chip-row" id="style-chips">
              <button type="button" class="chip" data-value="solo">Solo</button>
              <button type="button" class="chip" data-value="couple">Couple</button>
              <button type="button" class="chip" data-value="family">Family</button>
              <button type="button" class="chip" data-value="friends">Friends</button>
              <button type="button" class="chip" data-value="business">Business</button>
            </div>
            <p class="field__error" id="style-error" hidden></p>
          </div>

          <div class="field">
            <span class="field__label">Budget level</span>
            <div class="chip-row" id="budget-chips">
              <button type="button" class="chip" data-value="low">Low</button>
              <button type="button" class="chip" data-value="medium">Medium</button>
              <button type="button" class="chip" data-value="high">High</button>
              <button type="button" class="chip" data-value="luxury">Luxury</button>
            </div>
            <p class="field__error" id="budget-error" hidden></p>
          </div>

          <div class="field">
            <span class="field__label">Interests</span>
            <div class="chip-row" id="interest-chips">
              <button type="button" class="chip" data-value="Food">Food</button>
              <button type="button" class="chip" data-value="History">History</button>
              <button type="button" class="chip" data-value="Nature">Nature</button>
              <button type="button" class="chip" data-value="Nightlife">Nightlife</button>
              <button type="button" class="chip" data-value="Photography">Photography</button>
              <button type="button" class="chip" data-value="Shopping">Shopping</button>
            </div>
            <p class="field__error" id="interests-error" hidden></p>
          </div>

          <div class="btn-row">
            <button type="submit" class="btn btn--primary">Save survey</button>
            <a href="/surveys.html" class="btn btn--ghost">Cancel</a>
          </div>
        </form>
      </div>
    </main>

    <footer class="app__footer">
      <span>Travel Planner</span>
      <span>•</span>
      <span>Plan. Explore. Remember.</span>
    </footer>
  </div>

  <script src="../assets/js/core/config.js"></script>
  <script src="../assets/js/core/api.js"></script>
  <script src="../assets/js/core/session.js"></script>
  <script src="../assets/js/core/nav-config.js"></script>
  <script src="../assets/js/core/app-shell.js"></script>
  <script src="../assets/js/survey-form.js"></script>
  </body>
</html>
