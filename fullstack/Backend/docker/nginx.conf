# Nginx — API-only backend, no MVC, no static HTML serving
# All traffic → PHP-FPM → Laravel → JSON responses

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 50M;

    # Hide nginx version
    server_tokens off;

    server {
        listen ${PORT} default_server;
        server_name _;

        root /var/www/html/public;
        index index.php;

        # Health check endpoint (Laravel /up) — no PHP overhead for load balancer
        location = /up {
            try_files $uri /index.php?$query_string;
        }

        # Block direct access to dot-files (.env, .git, etc.)
        location ~ /\. {
            deny all;
            return 404;
        }

        # Block access to sensitive files
        location ~* \.(env|log|key|sqlite)$ {
            deny all;
            return 404;
        }

        # All requests → Laravel front controller
        # This is an API-only backend — no static assets served here
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # PHP-FPM handler
        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include /etc/nginx/fastcgi_params;

            # Pass real client IP (Railway proxies through load balancer)
            fastcgi_param HTTP_X_FORWARDED_FOR $http_x_forwarded_for;
            fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;

            fastcgi_read_timeout 300;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
        }
    }
}
