<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Analytics · Itinari Admin</title>
  <link rel="stylesheet" href="../assets/css/admin.css?v=15" />
  <script>/* FOUC prevention — default dark */
    (function(){var k="itinari_theme",s;try{s=localStorage.getItem(k);}catch(e){}
    if(!s||s==="dark"||(s==="system"&&window.matchMedia&&window.matchMedia("(prefers-color-scheme:dark)").matches))
      document.documentElement.classList.add("dark","fouc-ready");
    else document.documentElement.classList.add("fouc-ready");
    })();
  </script></head>
<body data-page="admin" data-layout="admin">
  <a href="#main" class="skip-link">Skip to main content</a>
  <div class="shell">
    <aside class="sidebar">
      <div class="sidebar-brand"><span class="brand-mark" aria-hidden="true">IT</span><div class="sidebar-brand-inner"><span class="brand-gate">ITINARI · ADM</span><span class="brand">Departure Control</span></div><button type="button" id="sidebar-collapse" class="icon-btn collapse-btn" aria-label="Collapse sidebar" aria-expanded="true" aria-keyshortcuts="Control+B Meta+B"><span class="icon-panel-left"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="9" y1="4" x2="9" y2="20"/></svg></span><span class="icon-panel-right"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="15" y1="4" x2="15" y2="20"/></svg></span></button></div>
      <nav class="nav" aria-label="Admin"></nav>
      <div class="sidebar-foot">
        <button type="button" id="logout-btn" class="btn-ghost btn-block sidebar-logout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg><span class="nav-label">Log out</span></button>
      </div>
    </aside>

    <main id="main" class="content">
      <div class="topbar">
        <div class="topbar-right">
          <button type="button" id="theme-toggle" class="icon-btn" aria-pressed="false" aria-label="Toggle theme"><svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/><line x1="4.9" y1="4.9" x2="6.3" y2="6.3"/><line x1="17.7" y1="17.7" x2="19.1" y2="19.1"/><line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/><line x1="4.9" y1="19.1" x2="6.3" y2="17.7"/><line x1="17.7" y1="6.3" x2="19.1" y2="4.9"/></svg><svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg></button>
        </div>
      </div>
      <header class="content-head">
        <div class="right">
          <p class="label-eyebrow" style="margin: 0 0 0.35rem;">FLIGHT RECORDER · GATE R-01</p>
          <h1>Analytics</h1>
          <p class="view-sub">Users, revenue, travel styles</p>
        </div>
        <span id="user-chip" class="chip" hidden>
          <span id="chip-name"></span>
          <span id="chip-role" class="chip-role"></span>
        </span>
      </header>

      <section class="kpi-grid" id="kpi-row" aria-label="Analytics KPIs">
        <article class="ticket kpi-ticket" id="kpi-users">
          <p class="label-eyebrow">TOTAL USERS</p>
          <div class="kpi-value">–</div>
        </article>
        <article class="ticket kpi-ticket" id="kpi-new">
          <p class="label-eyebrow">NEW · 30D</p>
          <div class="kpi-value">–</div>
        </article>
        <article class="ticket kpi-ticket" id="kpi-rev">
          <p class="label-eyebrow">TOTAL REVENUE</p>
          <div class="kpi-value">–</div>
        </article>
        <article class="ticket kpi-ticket" id="kpi-avg">
          <p class="label-eyebrow">AVG BOOKING</p>
          <div class="kpi-value">–</div>
        </article>
      </section>

      <div class="columns">
        <section class="ticket ticket-panel" aria-label="Users by month">
<div class="chart-head">
            <span class="chart-chip"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
            <div>
              <p class="label-eyebrow" style="margin: 0 0 0.25rem;">SIGNUPS · MONTHLY</p>
              <h2 class="chart-title">New users</h2>
            </div>
          </div>
          <div class="panel-body">
            <div id="chart-users" class="chart"></div>
          </div>
        </section>
        <section class="ticket ticket-panel" aria-label="Revenue by month">
<div class="chart-head">
            <span class="chart-chip"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1v22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></span>
            <div>
              <p class="label-eyebrow" style="margin: 0 0 0.25rem;">REVENUE · MONTHLY</p>
              <h2 class="chart-title">Bookings value</h2>
            </div>
          </div>
          <div class="panel-body">
            <div id="chart-revenue" class="chart"></div>
          </div>
        </section>
      </div>

      <section class="ticket ticket-panel" aria-label="Revenue by travel style">
        <div class="panel-head">
          <p class="label-eyebrow" style="margin: 0 0 0.25rem;">BY TRAVEL STYLE</p>
          <h2 style="margin: 0;">Revenue split</h2>
        </div>
        <div class="panel-body">
          <div id="style-split" class="kit-grid"></div>
        </div>
      </section>
    </main>
  </div>

  <div id="site-banner" role="status">
    <span id="site-banner-msg"></span><span id="site-banner-drain" aria-hidden="true"></span>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="../assets/js/config.js?v=1786177601"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/animations.js?v=3"></script>
  <script src="../assets/js/session.js"></script>
  <script src="../assets/js/nav-config.js"></script>
  <script src="../assets/js/admin-chrome.js?v=12"></script>
  <script src="../assets/js/admin-analytics.js?v=3"></script>
  <script src="../assets/js/core/topbar.js"></script>
  <script src="../assets/js/core/theme.js"></script>
</body>
</html>
