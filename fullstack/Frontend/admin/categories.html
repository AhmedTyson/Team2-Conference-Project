<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Category Management · Itinari Admin</title>
  <link rel="stylesheet" href="../assets/css/admin.css" />
</head>
<body data-page="admin">
  <a href="#main" class="skip-link">Skip to main content</a>
  <div class="shell">
    <aside class="sidebar">
      <div class="sidebar-brand"><span class="brand-mark" aria-hidden="true">IT</span><div class="sidebar-brand-inner"><span class="brand-gate">ITINARI · ADM</span><span class="brand">Departure Control</span></div><button type="button" id="sidebar-collapse" class="icon-btn collapse-btn" aria-label="Collapse sidebar" aria-expanded="true" aria-keyshortcuts="Control+B Meta+B"><span class="icon-panel-left"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="9" y1="4" x2="9" y2="20"/></svg></span><span class="icon-panel-right"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="15" y1="4" x2="15" y2="20"/></svg></span></button></div>
      <nav class="nav" aria-label="Admin"></nav>
      <div class="sidebar-foot">
        <button type="button" id="logout-btn" class="btn-ghost btn-block sidebar-logout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg><span class="nav-label">Log out</span></button>
      </div>
    </aside>

    <main id="main" class="content">
      <div class="topbar">
        <div class="topbar-right">
          <button type="button" id="theme-toggle" class="icon-btn" aria-pressed="false" aria-label="Toggle theme"><svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/><line x1="4.9" y1="4.9" x2="6.3" y2="6.3"/><line x1="17.7" y1="17.7" x2="19.1" y2="19.1"/><line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/><line x1="4.9" y1="19.1" x2="6.3" y2="17.7"/><line x1="17.7" y1="6.3" x2="19.1" y2="4.9"/></svg><svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg></button>
        </div>
      </div>
      <header class="content-head" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:1rem;">
        <div class="right" style="flex:1;">
          <p class="label-eyebrow" style="margin: 0 0 0.35rem; color: var(--color-primary);">CATALOG · TAXONOMY</p>
          <h1 style="margin:0 0 0.25rem 0;">Categories</h1>
          <p class="view-sub" style="margin:0;">Manage application categories (destinations, hotels, etc.)</p>
        </div>
        <div>
          <button id="create-btn" class="btn btn-primary" type="button" style="display:inline-flex; align-items:center; gap:0.5rem; padding:0.6rem 1.2rem; font-weight:600; border-radius:8px;">
            <i class="fas fa-plus"></i> Add Category
          </button>
        </div>
      </header>

      <section class="ticket ticket-panel">
        <div class="panel-head">
          <p class="label-eyebrow" style="margin: 0 0 0.25rem;">DATABASE</p>
          <h2 style="margin: 0;">All Categories</h2>
        </div>
        <div class="panel-body">
          <div id="categories-list" class="kit-grid" style="gap:1rem;">
            <div class="skeleton-rect" style="height: 60px;"></div>
            <div class="skeleton-rect" style="height: 60px;"></div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div id="site-banner" role="status">
    <span id="site-banner-msg"></span><span id="site-banner-drain" aria-hidden="true"></span>
  </div>

  <!-- Create/Edit Category Modal -->
  <dialog id="category-modal" class="modal">
    <form method="dialog" id="category-form" class="modal-content ticket">
      <header class="modal-header">
        <h2 class="modal-title" id="modal-title">Add Category</h2>
        <button type="button" class="icon-btn close-btn" aria-label="Close" onclick="document.getElementById('category-modal').close()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
      </header>
      <div class="modal-body">
        <input type="hidden" id="cat-id" name="id">
        <div class="field">
          <label for="cat-name" class="label">Name</label>
          <input type="text" id="cat-name" name="name" class="input" placeholder="e.g. Beaches" required>
        </div>
        <div class="field">
          <label for="cat-slug" class="label">Slug</label>
          <input type="text" id="cat-slug" name="slug" class="input" placeholder="e.g. beaches" required>
        </div>
        <div class="field">
          <label for="cat-type" class="label">Type</label>
          <select id="cat-type" name="type" class="input" required>
            <option value="destination">Destination</option>
            <option value="hotel">Hotel</option>
            <option value="restaurant">Restaurant</option>
            <option value="attraction">Attraction</option>
          </select>
        </div>
      </div>
      <footer class="modal-footer">
        <button type="button" class="btn btn-ghost" onclick="document.getElementById('category-modal').close()">Cancel</button>
        <button type="submit" class="btn btn-primary" id="submit-cat-btn">Save</button>
      </footer>
    </form>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/animations.js"></script>
  <script src="../assets/js/session.js"></script>
  <script src="../assets/js/nav-config.js"></script>
  <script src="../assets/js/admin-chrome.js"></script>
  <script src="../assets/js/admin-categories.js"></script>
</body>
</html>
