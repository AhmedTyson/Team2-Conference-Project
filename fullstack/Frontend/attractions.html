<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Attractions Catalog · Itinera</title>
  <meta name="description" content="Explore iconic landmarks, museums, and tours with Itinera." />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <!-- Font Awesome 6 Free -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- Custom Luxury Stylesheet -->
  <link rel="stylesheet" href="assets/css/public.css" />
  <script>/* FOUC prevention — default dark */
    (function(){var k="itinera_theme",s;try{s=localStorage.getItem(k);}catch(e){}
    if(!s||s==="dark"||(s==="system"&&window.matchMedia&&window.matchMedia("(prefers-color-scheme:dark)").matches))
      document.documentElement.classList.add("dark","fouc-ready");
    else document.documentElement.classList.add("fouc-ready");
    })();
  </script>
</head>
<body class="bg-[#0a0a0a] text-white bg-sculpture-relief" data-layout="public" data-default-tab="attractions">

  <div class="app-wrapper">

    <!-- Top Navigation Header -->
    <header class="app-nav-header"></header>

    <!-- Main Catalog Section -->
    <main class="max-w-7xl mx-auto px-6 py-8">
      
      <!-- Header -->
      <div class="mb-10">
        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-white/10 text-xs font-semibold uppercase tracking-wider text-amber-400 mb-3">
          <span>Cultural Highlights</span>
        </div>
        <h1 class="text-3xl sm:text-5xl font-black tracking-tight text-white">Iconic Attractions</h1>
        <p class="text-white/60 text-base max-w-2xl mt-2">
          Uncover heritage landmarks, architectural marvels, guided tours, and museum exhibits.
        </p>
      </div>

      <!-- Category Filter Tabs
      <div class="flex items-center gap-2 border-b border-white/10 pb-4 mb-6 overflow-x-auto" id="catalog-tabs" role="tablist">
        <button class="chip" data-tab="destinations"><i class="fas fa-location-dot mr-1"></i> Destinations</button>
        <button class="chip" data-tab="hotels"><i class="fas fa-hotel mr-1"></i> Hotels</button>
        <button class="chip" data-tab="restaurants"><i class="fas fa-utensils mr-1"></i> Restaurants</button>
        <button class="chip on" data-tab="attractions"><i class="fas fa-landmark mr-1"></i> Attractions</button>
        <button class="chip" data-tab="flights"><i class="fas fa-plane mr-1"></i> Flights</button>
      </div> -->

      <!-- Controls: Search & Region Pills -->
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
        
        <!-- Search Input -->
        <div class="relative w-full md:max-w-xs">
          <i class="fas fa-search absolute left-3.5 top-1/2 -translate-y-1/2 text-white/40 text-xs"></i>
          <input
            type="search"
            id="catalog-search"
            placeholder="Search attractions by name, category..."
            class="w-full bg-white/5 border border-white/10 rounded-full pl-9 pr-4 py-2 text-sm text-white placeholder-white/40 outline-none focus:border-white/40 transition"
          />
        </div>

        <!-- Region Filter Pills -->
        <div class="flex items-center gap-1.5 overflow-x-auto pb-1" id="region-pills" role="radiogroup">
          <!-- Dynamic region pills loaded via explore.js -->
        </div>

      </div>

      <!-- Catalog Grid -->
      <div id="catalog-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
        <div class="col-span-full py-16 text-center text-white/50">
          <i class="fas fa-circle-notch fa-spin mr-2"></i> Loading attractions...
        </div>
      </div>

    </main>

    <!-- Footer -->
    <footer class="app-footer mt-20">
      <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between text-xs text-white/40 gap-4">
        <span>&copy; <span id="footerYear"></span> Itinera · Team 2 Conference Project. All rights reserved.</span>
        <div class="flex gap-6">
          <a href="about.html">About</a>
          <a href="contact.html">Contact</a>
          <a href="help.html">Help Center</a>
        </div>
      </div>
    </footer>

  </div>

  <!-- Scripts -->
  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/session.js"></script>
  <script src="assets/js/nav-config.js"></script>
  <script src="assets/js/utils/unsplash-helper.js"></script>
  <script src="assets/js/explore.js"></script>
  <script src="./assets/js/core/navbar-component.js"></script>
  <script src="./assets/js/core/theme.js"></script>
  <script src="assets/js/core/topbar.js"></script>
</body>
</html>
