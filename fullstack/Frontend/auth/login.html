<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in · Itinera</title>
  
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- Stylesheets -->
  <link rel="stylesheet" href="../assets/css/tokens.css" />
  <link rel="stylesheet" href="../assets/css/auth.css" />

  <script>/* FOUC prevention — default dark */
    (function(){var k="itinera_theme",s;try{s=localStorage.getItem(k);}catch(e){}
    if(!s||s==="dark"||(s==="system"&&window.matchMedia&&window.matchMedia("(prefers-color-scheme:dark)").matches))
      document.documentElement.classList.add("dark","fouc-ready");
    else document.documentElement.classList.add("fouc-ready");
    })();
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body data-page="login" data-layout="auth">
  <a href="#main-content-target" class="skip-link">Skip to main content</a>
  

  <!-- Main Auth Container -->
  <div class="auth-main-wrapper" id="main-content-target">
    <main class="auth-shell">
      <section class="auth-visual">
        <div class="auth-slides">
          <div class="auth-slide active" style="background-image: url('../assets/img/slide1.png');"></div>
          <div class="auth-slide" style="background-image: url('../assets/img/slide2.png');"></div>
          <div class="auth-slide" style="background-image: url('../assets/img/slide3.png');"></div>
        </div>
        <div class="brand">Itinera</div>
        <div>
          <h1>Welcome back.</h1>
          <p>Discover places the locals love, from people who call them home.</p>
        </div>
      </section>

      <section class="auth-form-side">
<div class="auth-card">
          <div class="auth-brand">Itinera</div>
          <h2>Log in</h2>
          <p class="sub">Use your Itinera account to continue.</p>

          <div class="google-auth-wrapper">
            <a href="#" id="btn-google-login" class="btn-google">
              <svg viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
              </svg>
              <span>Continue with Google</span>
            </a>
          </div>

          <div class="google-auth-wrapper">
            <a href="#" id="btn-facebook-login" class="btn-google">
              <svg viewBox="0 0 24 24">
                <path fill="#1877F2" d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
              </svg>
              <span>Continue with Facebook</span>
            </a>
          </div>

          <div class="auth-divider">
            <span>or continue with email</span>
          </div>

          <form id="auth-form" novalidate>
            <div class="field">
              <label for="email">Email</label>
              <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" />
              <p class="field-hint" id="hint-email" role="alert"></p>
            </div>

            <div class="field">
              <label for="password">Password</label>
              <div class="input-wrap">
                <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" />
                <button type="button" class="pw-toggle" data-pw-toggle aria-label="Show password" aria-pressed="false">👁</button>
              </div>
              <p class="field-hint" id="hint-password" role="alert"></p>
            </div>

            <button type="submit" class="btn-primary">
              <span class="spinner"></span>
              <span class="btn-label">Log in</span>
            </button>

            <div class="success-note" id="li-success-note"></div>
          </form>

<div class="auth-links">
            <a href="forgot.html">Forgot password?</a>
            <span>•</span>
            <a href="register.html">Create an account</a>
          </div>

          <a href="../index.html" class="auth-back">
            <i class="fas fa-arrow-left"></i>
            Back to home
          </a>
        </div>
      </section>
    </main>
  </div>

  

  <div id="site-banner" role="status">
    <span id="site-banner-msg"></span><span id="site-banner-drain" aria-hidden="true"></span>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="../assets/js/core/config.js"></script>
  <script src="../assets/js/core/api.js"></script>
  <script src="../assets/js/utils/validation.js"></script>
  <script src="../assets/js/core/animations.js"></script>
  <script src="../assets/js/core/session.js"></script>
  <script src="../assets/js/utils/password-toggle.js"></script>
  <script src="../assets/js/pages/auth/auth.js"></script>
  <script src="../assets/js/core/topbar.js"></script>
  <script src="../assets/js/core/theme.js"></script>
</body>
</html>
