<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verify your email · Itinera</title>

  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- Stylesheets -->
  <link rel="stylesheet" href="../assets/css/tokens.css" />
  <link rel="stylesheet" href="../assets/css/auth.css" />

  <script>/* FOUC prevention — default dark */
    (function(){var k="itinera_theme",s;try{s=localStorage.getItem(k);}catch(e){}
    if(!s||s==="dark"||(s==="system"&&window.matchMedia&&window.matchMedia("(prefers-color-scheme:dark)").matches))
      document.documentElement.classList.add("dark","fouc-ready");
    else document.documentElement.classList.add("fouc-ready");
    })();
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body data-page="verify" data-layout="auth">
  <!-- Minimal Auth Nav -->
  <header class="auth-nav">
    <a href="../index.html" class="auth-nav-brand">
      <i class="fas fa-globe text-amber-400"></i>
      <span>Itinera</span>
    </a>
    <a href="../index.html" class="auth-nav-home">
      <i class="fas fa-arrow-left"></i>
      <span>Back to home</span>
    </a>
  </header>
  <a href="#main-content-target" class="skip-link">Skip to main content</a>

  <!-- Top Navigation Header -->
  

  <!-- Main Auth Container -->
  <div class="auth-main-wrapper" id="main-content-target">
    <main class="auth-shell">
      <section class="auth-visual">
        <div class="auth-slides">
          <div class="auth-slide active" style="background-image: url('../assets/img/slide1.png');"></div>
          <div class="auth-slide" style="background-image: url('../assets/img/slide2.png');"></div>
          <div class="auth-slide" style="background-image: url('../assets/img/slide3.png');"></div>
        </div>
        <div class="brand">Itinera</div>
        <div>
          <h1>One last step.</h1>
          <p>Confirm your email to unlock the full travel and itinerary experience.</p>
        </div>
      </section>

      <section class="auth-form-side">
        <div class="auth-card">
          <h2>Check your inbox</h2>
          <p class="sub">We sent a verification link to your email address. Follow it to activate your account.</p>

          <input type="hidden" id="v-email-src" />

          <div style="margin-top: 1.5rem;">
            <button type="button" id="v-resend" class="btn-primary">
              <span class="spinner"></span>
              <span class="btn-label">Resend verification email</span>
            </button>
          </div>

          <div class="auth-links">
            <a href="login.html">Back to log in</a>
          </div>
        </div>
      </section>
    </main>
  </div>

  

  <div id="site-banner" role="status">
    <span id="site-banner-msg"></span><span id="site-banner-drain" aria-hidden="true"></span>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="../assets/js/core/config.js"></script>
  <script src="../assets/js/core/api.js"></script>
  <script src="../assets/js/utils/validation.js"></script>
  <script src="../assets/js/core/animations.js"></script>
  <script src="../assets/js/core/session.js"></script>
  <script src="../assets/js/utils/password-toggle.js"></script>
  <script src="../assets/js/pages/auth/auth.js"></script>
  <script src="../assets/js/core/topbar.js"></script>
  <script src="../assets/js/core/theme.js"></script>
</body>
</html>
