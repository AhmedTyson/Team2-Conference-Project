<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Membership Plans · Itinera</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <!-- Font Awesome 6 Free -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- Custom Luxury Stylesheets -->
  <link rel="stylesheet" href="assets/css/tokens.css" />
  <link rel="stylesheet" href="assets/css/public.css" />
  <link rel="stylesheet" href="assets/css/app.css" />

  <style>
    .glass-card {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 1.25rem;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .glass-card:hover {
      border-color: rgba(255, 255, 255, 0.18);
      transform: translateY(-2px);
    }
    .glass-card-featured {
      border-color: rgba(245, 158, 11, 0.45);
      background: rgba(255, 255, 255, 0.07);
      box-shadow: 0 10px 30px -10px rgba(245, 158, 11, 0.15);
    }
    .plan-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.2rem 0.65rem;
      border-radius: 9999px;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .plan-badge-active {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .plan-badge-featured {
      background: #f59e0b;
      color: #000;
    }
    .skeleton-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 1.25rem;
      padding: 2rem;
      height: 460px;
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.8; }
    }
  </style>

  <script>/* FOUC prevention — default dark */
    (function(){var k="itinera_theme",s;try{s=localStorage.getItem(k);}catch(e){}
    if(!s||s==="dark"||(s==="system"&&window.matchMedia&&window.matchMedia("(prefers-color-scheme:dark)").matches))
      document.documentElement.classList.add("dark","fouc-ready");
    else document.documentElement.classList.add("fouc-ready");
    })();
  </script>
</head>
<body class="bg-[#0a0a0a] text-white" data-layout="public">

  <div class="app-wrapper min-h-screen flex flex-col justify-between">

    <!-- Top Navigation Header -->
    <header class="app-nav-header"></header>

    <!-- Main Pricing Section -->
    <main class="max-w-6xl mx-auto px-6 py-12 flex-1 w-full">
      
      <div class="text-center space-y-4 mb-12">
        <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-white/10 text-xs font-semibold uppercase tracking-wider text-amber-400">
          <span>Flexible Membership</span>
        </div>
        <h1 class="text-4xl sm:text-6xl font-black tracking-tight text-white">Elevate Your Travel Tier</h1>
        <p class="text-lg text-white/60 max-w-2xl mx-auto font-light leading-relaxed">
          Unlock unlimited AI itinerary generations, priority partner agency matching, and secure checkout powered by Paymob.
        </p>
      </div>

      <!-- Current Active Subscription Banner (Visible when user has an active plan) -->
      <div id="currentSubscriptionBanner" class="hidden mb-10"></div>

      <!-- Pricing Plans Container (Dynamic from backend API) -->
      <div id="plansGrid" class="grid grid-cols-1 md:grid-cols-3 gap-8 items-stretch mb-16">
        <!-- Initial Skeleton Loading State -->
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
      </div>

      <!-- Plan Comparison Link -->
      <div class="text-center">
        <a href="plan-compare.html" class="inline-flex items-center gap-2 text-sm text-white/60 hover:text-white transition">
          <span>Compare full feature breakdown matrix</span>
          <i class="fas fa-arrow-right text-xs"></i>
        </a>
      </div>

    </main>

    <!-- Footer -->
    <footer class="app-footer"></footer>

  </div>

  <!-- Shared Toast UI -->
  <div class="toast" id="toast">
    <i class="fas fa-check-circle text-green-400" aria-hidden="true"></i>
    <span id="toastMessage">Notification</span>
  </div>

  <!-- Scripts -->
  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/session.js"></script>
  <script src="js/plans-core.js"></script>
  <script src="assets/js/plans.js"></script>
  <script src="assets/js/nav-config.js"></script>
  <script src="assets/js/core/navbar-component.js"></script>
  <script src="assets/js/core/theme.js"></script>
  <script src="assets/js/core/topbar.js"></script>
  <script src="./assets/js/core/footer-component.js"></script>
</body>
</html>
