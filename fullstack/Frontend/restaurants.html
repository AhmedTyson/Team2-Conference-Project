  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>(function(){try{if(localStorage.getItem('itinera_theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/pages.css">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/app.css">
  <script>/* FOUC prevention — default dark */
    (function(){var k="itinari_theme",s;try{s=localStorage.getItem(k);}catch(e){}
    if(!s||s==="dark"||(s==="system"&&window.matchMedia&&window.matchMedia("(prefers-color-scheme:dark)").matches))
      document.documentElement.classList.add("dark","fouc-ready");
    else document.documentElement.classList.add("fouc-ready");
    })();
  </script></head>
<body data-page="restaurants" class="is-booting" data-layout="public">
  <div class="app">
      <!-- Top Navigation Header -->
  <header class="app-nav-header">
    <div class="app-nav-container">
      <a href="index.html" class="app-brand">
        <span class="brand-mark">IT</span>
        <span class="brand-name">Itinera</span>
      </a>

      <div class="topbar-right" id="navAuthContainer">
        <button type="button" id="theme-toggle" class="icon-btn theme-toggle" aria-label="Toggle theme">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/><line x1="4.9" y1="4.9" x2="6.3" y2="6.3"/><line x1="17.7" y1="17.7" x2="19.1" y2="19.1"/><line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/><line x1="4.9" y1="19.1" x2="6.3" y2="17.7"/><line x1="17.7" y1="6.3" x2="19.1" y2="4.9"/></svg>

        </button>
        <a href="auth/login.html" class="guest-actions">
          <span>Sign in</span>
          <i class="fas fa-arrow-right text-xs"></i>
        </a>
      </div>
    </div>
  </header>

    <main class="app__main">

  <main id="main">
    <section class="page-hero">
      <div class="container">
        <p class="eyebrow"><span class="knum">03</span> / TASTE</p>
        <h1>Restaurants</h1>
        <p class="hero-sub">A table worth finding — kitchens with point of view.</p>
      </div>
    </section>

    <section class="section" aria-label="All restaurants">
      <div class="container">
        <div class="toolbar" role="search" aria-label="Filter restaurants">
          <label class="search-box">
            <span class="search-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            </span>
            <input type="search" class="search-input" id="searchInput" placeholder="Search restaurants…" autocomplete="off">
          </label>
          <div class="chip-group" id="filterChips" aria-label="Filter by destination"></div>
          <div class="chip-group" id="priceChips" aria-label="Filter by price range"></div>
          <div class="toolbar-row">
            <span class="result-count" id="resultCount" aria-live="polite">—</span>
            <label class="search-box" style="flex:0 0 auto" aria-label="Sort restaurants">
              <select class="select" id="sortSelect">
                <option value="name">Name A–Z</option>
                <option value="rating">Rating</option>
              </select>
            </label>
          </div>
        </div>
        <div class="grid" id="results"></div>
        <div class="pagination" id="pagination" aria-label="Pagination"></div>
        <div class="state-host" id="stateHost" aria-live="polite"></div>
      </div>
    </section>
  </main>

    </main>

    <footer class="app__footer"></footer>
  </div>

  <div class="toast-host" id="toastHost" aria-live="assertive"></div>
  <div class="modal" id="modalHost" hidden></div>

  <script>
    It.app.boot();
  </script>
  <script src="./assets/js/core/theme.js"></script>
  <script src="assets/js/core/topbar.js"></script>

</html>
