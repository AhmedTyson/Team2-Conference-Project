<header class="fixed top-0 left-0 right-0 z-[99999] w-full px-4 py-3 bg-transparent font-sans transition-all duration-300 pointer-events-none" id="global-navbar">

      <a href="./index.html" data-nav-id="home" class="px-3.5 py-1.5 rounded-full hover:text-white hover:bg-white/10 transition-all duration-200">
        Home
      </a>

        <button type="button" data-nav-id="discover" class="px-3.5 py-1.5 rounded-full hover:text-white hover:bg-white/10 transition-all duration-200 flex items-center gap-1">
          <span>Discover</span>

        </button>
        <div class="absolute top-full left-0 mt-2 w-52 py-2 rounded-2xl bg-[#121212]/95 backdrop-blur-2xl border border-white/10 shadow-2xl opacity-0 invisible group-hover/drop:opacity-100 group-hover/drop:visible transition-all duration-200 z-50">
          <a href="./explore.html" data-nav-id="explore" class="flex items-center gap-2.5 px-4 py-2 text-xs text-white/80 hover:text-amber-400 hover:bg-white/5 transition-colors">

          <a href="./hotels.html" data-nav-id="hotels" class="flex items-center gap-2.5 px-4 py-2 text-xs text-white/80 hover:text-amber-400 hover:bg-white/5 transition-colors">

          <a href="./restaurants.html" data-nav-id="restaurants" class="flex items-center gap-2.5 px-4 py-2 text-xs text-white/80 hover:text-amber-400 hover:bg-white/5 transition-colors">

          <a href="./flights.html" data-nav-id="flights" class="flex items-center gap-2.5 px-4 py-2 text-xs text-white/80 hover:text-amber-400 hover:bg-white/5 transition-colors">
            <i class="fas fa-plane-departure w-4 text-sky-400"></i> Flights
          </a>
          <div class="my-1 border-t border-white/10"></div>
          <a href="./weather.html" data-nav-id="weather" class="flex items-center gap-2.5 px-4 py-2 text-xs text-white/80 hover:text-amber-400 hover:bg-white/5 transition-colors">
            <i class="fas fa-cloud-sun w-4 text-amber-300"></i> Live Weather
          </a>
        </div>
      </div>

      <!-- User Travel Hub Dropdown (Visible to logged-in members) -->
      <div class="relative group/drop hidden" id="dropdown-user-hub">
        <button type="button" data-nav-id="hub" class="px-3.5 py-1.5 rounded-full hover:text-white hover:bg-white/10 transition-all duration-200 flex items-center gap-1 text-amber-300">
          <i class="fas fa-crown text-[11px]"></i>
          <span>My Hub</span>
          <i class="fas fa-chevron-down text-[10px] opacity-60 group-hover/drop:rotate-180 transition-transform duration-200"></i>
        </button>
        <div class="absolute top-full left-0 mt-2 w-56 py-2 rounded-2xl bg-[#121212]/95 backdrop-blur-2xl border border-white/10 shadow-2xl opacity-0 invisible group-hover/drop:opacity-100 group-hover/drop:visible transition-all duration-200 z-50">
          <a href="./app/dashboard.html" data-nav-id="dashboard" class="flex items-center gap-2.5 px-4 py-2 text-xs text-white/80 hover:text-amber-400 hover:bg-white/5 transition-colors">

          <a href="./app/trips.html" data-nav-id="trips" class="flex items-center gap-2.5 px-4 py-2 text-xs text-white/80 hover:text-amber-400 hover:bg-white/5 transition-colors">

          </a>
          <a href="./app/favourites.html" data-nav-id="favourites" class="flex items-center gap-2.5 px-4 py-2 text-xs text-white/80 hover:text-amber-400 hover:bg-white/5 transition-colors">

          </a>

      <!-- Pricing Plans -->
      <a href="./plans.html" data-nav-id="plans" class="px-3.5 py-1.5 rounded-full hover:text-white hover:bg-white/10 transition-all duration-200 flex items-center gap-1.5">

        <span class="px-1.5 py-0.5 rounded-md bg-amber-400/20 text-amber-300 text-[10px] font-bold">PRO</span>
      </a>

        <button type="button" data-nav-id="company" class="px-3.5 py-1.5 rounded-full hover:text-white hover:bg-white/10 transition-all duration-200 flex items-center gap-1">
          <span>Company</span>
          <i class="fas fa-chevron-down text-[10px] opacity-60 group-hover/drop:rotate-180 transition-transform duration-200"></i>
        </button>
        <div class="absolute top-full left-0 mt-2 w-48 py-2 rounded-2xl bg-[#121212]/95 backdrop-blur-2xl border border-white/10 shadow-2xl opacity-0 invisible group-hover/drop:opacity-100 group-hover/drop:visible transition-all duration-200 z-50">

          <a href="./contact.html" data-nav-id="contact" class="flex items-center gap-2.5 px-4 py-2 text-xs text-white/80 hover:text-amber-400 hover:bg-white/5 transition-colors">
            <i class="fas fa-envelope w-4 text-emerald-400"></i> Contact Us
          </a>
          <a href="./help.html" data-nav-id="help" class="flex items-center gap-2.5 px-4 py-2 text-xs text-white/80 hover:text-amber-400 hover:bg-white/5 transition-colors">
            <i class="fas fa-circle-question w-4 text-blue-400"></i> Help Center
          </a>

      <button type="button" id="cmd-trigger-btn" title="Search catalog (Ctrl+K)" class="hidden sm:flex items-center gap-2 px-3 py-1.5 rounded-full bg-white/5 hover:bg-white/10 border border-white/10 text-white/70 hover:text-white text-xs transition-all duration-200">
        <i class="fas fa-search text-[11px] text-amber-400"></i>
        <span class="hidden md:inline text-[11px]">Search...</span>
        <kbd class="hidden md:inline-block px-1.5 py-0.5 rounded bg-white/10 border border-white/15 text-[9px] font-mono text-white/50">Ctrl K</kbd>
      </button>

      <!-- Notification Bell with Live Unread Badge -->
      <div class="relative hidden" id="nav-bell-wrapper">
        <a href="./app/notifications.html" title="In-App Notifications" class="relative p-2.5 rounded-full hover:bg-white/10 text-white/70 hover:text-white transition-all flex items-center justify-center">
          <i class="fas fa-bell text-sm"></i>
          <span id="nav-bell-badge" class="absolute top-1 right-1 w-4 h-4 rounded-full bg-amber-500 text-black text-[9px] font-black hidden items-center justify-center ring-2 ring-black">0</span>
        </a>

      <!-- Theme Toggle -->
      <button type="button" id="theme-toggle" title="Toggle Dark/Light Theme" class="p-2.5 rounded-full hover:bg-white/10 text-white/70 hover:text-white transition-all flex items-center justify-center">

          Sign In
        </a>
        <a href="./auth/register.html" class="px-4 py-1.5 rounded-full bg-amber-400 hover:bg-amber-300 text-black text-xs font-bold shadow-md shadow-amber-400/20 hover:scale-105 transition-all">
          Get Started
        </a>
      </div>

            <i class="fas fa-sign-out-alt w-4"></i> Sign Out
