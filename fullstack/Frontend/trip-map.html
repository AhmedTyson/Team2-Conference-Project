<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Itinera – Trip Map</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="css/trip-map.css" />
</head>
<body data-page="trip-map" data-auth="protected">

    <nav class="sidebar" id="sidebar"></nav>

    <div class="main">
        <div class="flex-between mb-16">
            <h1 class="page-title" id="mpTitle">📍 Trip Map</h1>
            <div class="flex" style="gap:6px;">
                <a class="btn btn-sm" href="itinerary.html">
                    <i class="fas fa-arrow-left"></i> Back to trip
                </a>
            </div>
        </div>

        <div class="map-box">
            <span style="opacity:0.6; position:absolute; z-index:1;"><i class="fas fa-map-marker-alt" style="margin-right:8px;"></i> Interactive map placeholder</span>
            <div class="map-overlay">
                <h4>📍 Trip Points</h4>
                <ul id="mpPointsList">
                    <li>No itinerary items yet.</li>
                </ul>
            </div>
            <div style="position:absolute; bottom:16px; right:16px; background:#fff; border:2px solid #1a1a1a; border-radius:8px; padding:8px 14px; font-size:13px; font-weight:500; z-index:2;">
                <i class="fas fa-map-pin"></i> <span id="mpPins">0</span> pinned
            </div>
        </div>

        <div class="mt-16 flex" style="gap:16px; flex-wrap:wrap;" id="mpTags"></div>
    </div>

    <script src="js/common.js"></script>
    <script src="js/trip-map.js"></script>
</body>
</html>
