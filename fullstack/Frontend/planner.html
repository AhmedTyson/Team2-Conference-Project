<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✈️ Trip Planning Engine · Hana</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="assets/css/planner.css">
</head>
<body>
<div class="app-container">
    <!-- header -->
    <div class="app-header">
        <h1><i class="fas fa-plane-departure"></i> Trip Planner · Hana</h1>
        <div class="flex" style="gap: 1rem;">
            <div class="user-badge"><i class="fas fa-user-circle"></i> Loading...</div>
            <button type="button" id="logout-btn" class="btn-outline" style="padding: 0.4rem 1rem; font-size: 0.85rem; border-radius: 40px;">Log out</button>
        </div>
    </div>

    <!-- navigation -->
    <div class="nav-pills" id="navPills">
        <button class="active" data-page="page-trips"><i class="fas fa-list-ul"></i> My Trips</button>
        <button data-page="page-create"><i class="fas fa-plus-circle"></i> Create Trip</button>
        <button data-page="page-details" id="tab-details-btn"><i class="fas fa-map-pin"></i> Trip Details</button>
        <button data-page="page-schedule" id="tab-schedule-btn"><i class="fas fa-calendar-alt"></i> Schedule</button>
        <button data-page="page-checkout" id="tab-checkout-btn"><i class="fas fa-credit-card"></i> Checkout</button>
    </div>

    <!-- ========= PAGES ========= -->

    <!-- 1. My Trips List -->
    <div id="page-trips" class="page active">
        <div class="flex" style="justify-content: space-between; margin-bottom: 0.5rem;">
            <h2 style="color:var(--foreground);">✈️ My Trips</h2>
            <button class="btn-primary" onclick="navigateTo('page-create')"><i class="fas fa-plus"></i> New Trip</button>
        </div>
        <div class="trip-grid" id="trip-grid-container">
            <!-- Injected dynamically from database -->
        </div>
        <p class="text-muted" style="margin-top: 1.5rem;" id="trips-count-meta"><i class="fas fa-info-circle"></i> 0 trips · last updated today</p>
    </div>

    <!-- 2. Create Trip -->
    <div id="page-create" class="page">
        <h2 style="color:var(--foreground); margin-bottom: 1.2rem;"><i class="fas fa-pencil-alt"></i> Create new trip</h2>
        <div class="create-form">
            <div class="form-group">
                <label>Trip name</label>
                <input type="text" id="trip-title-input" placeholder="e.g. Japan Adventure" value="Kyoto & Tokyo">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Start</label>
                    <input type="date" id="trip-start-input" value="2026-09-10">
                </div>
                <div class="form-group">
                    <label>End</label>
                    <input type="date" id="trip-end-input" value="2026-09-20">
                </div>
            </div>
            <div class="form-group">
                <label>Travelers</label>
                <input type="number" id="trip-travelers-input" value="2" min="1">
            </div>
            <div style="display: flex; gap: 1rem; flex-wrap: wrap; margin-top: 0.5rem;">
                <button class="btn-primary" onclick="saveNewTripToDb()"><i class="fas fa-save"></i> Save Trip</button>
                <button class="btn-outline" onclick="navigateTo('page-trips')">Cancel</button>
            </div>
        </div>
    </div>

    <!-- 3. Trip Details (Timeline, Map, Attach/Detach modal) -->
    <div id="page-details" class="page">
        <div class="detail-header">
            <h2 id="details-trip-title"><i class="fas fa-map-marked-alt"></i> No Trip Selected</h2>
            <span><button class="btn-outline" style="padding:0.4rem 1.2rem;" onclick="navigateTo('page-trips')"><i class="fas fa-arrow-left"></i> Back</button></span>
        </div>
        <div class="timeline-map">
            <div>
                <h4 style="margin-bottom: 0.8rem;"><i class="fas fa-clock"></i> Timeline</h4>
                <div id="timeline-container">
                    <!-- Injected itinerary nodes -->
                </div>
            </div>
            <div>
                <h4 style="margin-bottom: 0.8rem;"><i class="fas fa-map"></i> Map Route</h4>
                <div class="map-placeholder" id="map-canvas-container">
                    <!-- Dynamic SVG route map -->
                </div>
                <!-- attach/detach modal simulation -->
                <div class="modal-card" style="margin-top: 1.2rem;">
                    <h4><i class="fas fa-paperclip"></i> Attach / Detach items</h4>
                    <div style="display: flex; gap: 8px; margin-bottom: 15px;">
                        <select id="modal-item-select" style="flex-grow: 1; padding: 6px 12px; border-radius: 20px; border: 1px solid hsl(var(--border)); outline: none;">
                            <!-- Option values populated dynamically -->
                        </select>
                        <button class="btn-primary" style="padding: 4px 14px; font-size: 13px;" onclick="addSelectedItemToTrip()">Attach</button>
                    </div>
                    <div id="attached-items-list">
                        <!-- Injected attached rows -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 4. Schedule (calendar-style view) -->
    <div id="page-schedule" class="page">
        <h2 style="color:var(--foreground);" id="schedule-trip-title"><i class="fas fa-calendar-check"></i> Schedule</h2>
        <div class="calendar-grid" id="calendar-days-container">
            <!-- Calendar days generated dynamically -->
        </div>
        <div class="schedule-list" id="schedule-items-list">
            <!-- Injected time slots -->
        </div>
        <p class="text-muted" style="margin-top: 1.5rem;"><i class="fas fa-sync-alt"></i> Reuses trip itinerary data</p>
    </div>

    <!-- 5. Checkout (booking summary → payment) -->
    <div id="page-checkout" class="page">
        <h2 style="color:var(--foreground);"><i class="fas fa-receipt"></i> Checkout · Booking summary</h2>
        <div class="checkout-summary" id="checkout-summary-container">
            <!-- Itemized invoices injected dynamically -->
        </div>
    </div>

</div>

<!-- Global toast notification banner -->
<div id="site-banner" role="status">
    <span id="site-banner-msg"></span><span id="site-banner-drain" aria-hidden="true"></span>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="assets/js/config.js?v=1786177601"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/animations.js"></script>
<script src="assets/js/session.js"></script>
<script src="assets/js/planner.js"></script>
</body>
</html>
