server {
    listen ${PORT} default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip static assets
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Config bundles carry the sed-injected API base which changes per
    # deploy — never cache them, or browsers keep calling the old origin.
    location = /assets/js/config.js {
        expires 0;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Pragma "no-cache";
        try_files $uri =404;
    }

    location = /assets/js/core/config.js {
        expires 0;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Pragma "no-cache";
        try_files $uri =404;
    }

    # Long cache for fingerprinted/bundled assets, short for HTML
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|eot|map)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # No caching for the entry document
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
