<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hotels — Itinera</title>
  <meta name="description" content="Browse hotels from the Itinera travel planner.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>(function(){try{if(localStorage.getItem('itinera_theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
  <link rel="stylesheet" href="assets/css/itinera-tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/pages.css">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/app.css">
  <script>/* FOUC prevention — default dark */
    (function(){var k="itinari_theme",s;try{s=localStorage.getItem(k);}catch(e){}
    if(!s||s==="dark"||(s==="system"&&window.matchMedia&&window.matchMedia("(prefers-color-scheme:dark)").matches))
      document.documentElement.classList.add("dark","fouc-ready");
    else document.documentElement.classList.add("fouc-ready");
    })();
  </script></head>
<body data-page="hotels" class="is-booting" data-layout="public">
  <div class="app">
    <header class="app__header">
      <a id="app-brand" class="app__brand" href="/home.html"></a>
      <nav id="app-nav" class="nav" aria-label="Main navigation"></nav>
      <div id="app-user" class="app__user">
        <button id="theme-toggle" type="button" class="btn btn--ghost" aria-label="Toggle theme">◐</button>
      </div>
    </header>

    <main class="app__main">

  <main id="main">
    <section class="page-hero">
      <div class="container">
        <p class="eyebrow"><span class="knum">02</span> / STAY</p>
        <h1>Hotels</h1>
        <p class="hero-sub">Where you rest matters — a shortlist of rooms with character.</p>
      </div>
    </section>

    <section class="section" aria-label="All hotels">
      <div class="container">
        <div class="toolbar" role="search" aria-label="Filter hotels">
          <label class="search-box">
            <span class="search-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            </span>
            <input type="search" class="search-input" id="searchInput" placeholder="Search hotels…" autocomplete="off">
          </label>
          <div class="chip-group" id="filterChips" aria-label="Filter by destination"></div>
          <div class="chip-group" id="starChips" aria-label="Filter by star rating"></div>
          <div class="toolbar-row">
            <span class="result-count" id="resultCount" aria-live="polite">—</span>
            <label class="search-box" style="flex:0 0 auto" aria-label="Sort hotels">
              <select class="select" id="sortSelect">
                <option value="price-asc">Price ↑</option>
                <option value="price-desc">Price ↓</option>
                <option value="rating">Rating</option>
              </select>
            </label>
          </div>
        </div>
        <div class="grid" id="results"></div>
        <div class="pagination" id="pagination" aria-label="Pagination"></div>
        <div class="state-host" id="stateHost" aria-live="polite"></div>
      </div>
    </section>
  </main>

    </main>

    <footer class="app__footer"></footer>
  </div>

  <div class="toast-host" id="toastHost" aria-live="assertive"></div>
  <div class="modal" id="modalHost" hidden></div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/session.js"></script>
  <script src="assets/js/nav-config.js"></script>
  <script src="assets/js/app-shell.js"></script>
  <script src="assets/js/itinera-config.js"></script>
  <script src="assets/js/itinera-api.js"></script>
  <script src="assets/js/itinera-auth.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/pages/hotels.js"></script>
  <script>
    It.app.boot();
  </script>
  <script src="./assets/js/core/theme.js"></script>
  <script src="assets/js/core/topbar.js"></script>
</body>
</html>
