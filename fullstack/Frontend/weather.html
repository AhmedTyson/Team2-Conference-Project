<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather · Itinera</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' };</script>

  <!-- Google Fonts -->

  <!-- Font Awesome 6 (free) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

  <!-- GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <!-- Shared styles -->
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="css/components/navbar.css" />
  <link rel="stylesheet" href="css/components/buttons.css" />
  <link rel="stylesheet" href="css/components/modal.css" />
  <link rel="stylesheet" href="css/components/toast.css" />
  <link rel="stylesheet" href="assets/css/tokens.css" />
  <link rel="stylesheet" href="assets/css/app.css" />

  <script>window.APP_URL = ".";</script>
</head>
<body class="page is-booting">

  <header class="app__header">
    <a id="app-brand" class="app__brand" href="/home.html"></a>
    <nav id="app-nav" class="nav" aria-label="Main navigation"></nav>
    <div id="app-user" class="app__user">
      <button id="theme-toggle" type="button" class="btn btn--ghost" aria-label="Toggle theme">◐</button>
    </div>
  </header>

  <div class="toast" id="toast">
  <i class="fas fa-check-circle text-green-600 dark:text-green-400" aria-hidden="true"></i>
  <span id="toastMessage">Success</span>
</div>


    <div class="page-scroll" style="padding-top: 80px;">
    <div class="giant-text"><h1>WEATHER</h1></div>
    <div class="content-layer">

      <div class="max-w-4xl mx-auto w-full mt-8">
        <div class="glass-card p-8">
          <h2 class="section-title flex items-center gap-3"><i class="fas fa-cloud-sun text-yellow-600 dark:text-yellow-400" aria-hidden="true"></i>Live Weather</h2>
          <div class="flex gap-3 mt-2">
            <input type="text" id="weatherInput" placeholder="City name (e.g. London)" class="flex-1 bg-slate-200 dark:bg-white/5 border border-white/10 rounded-lg p-3 text-sm focus:border-white/30 outline-none" />
            <button type="button" id="weatherSearchBtn" class="btn-primary">
              <i class="fas fa-search" aria-hidden="true"></i>Search
            </button>
          </div>
          <p id="weatherError" class="text-red-600 dark:text-red-400/70 text-sm mt-2" role="alert"></p>
          <div id="weatherResult" class="mt-4 glass-card p-5 hidden">
            <div class="flex justify-between">
              <div><h3 id="weatherCity" class="text-lg font-semibold">City</h3><span id="weatherCountry" class="text-slate-600 dark:text-white/40 text-sm">Country</span></div>
              <div class="text-right"><span id="weatherTemp" class="text-4xl font-bold">--°C</span><br /><span id="weatherDesc" class="text-slate-600 dark:text-white/50">--</span></div>
            </div>
            <div class="flex gap-6 mt-3 text-sm text-slate-600 dark:text-white/40">
              <span class="flex items-center gap-1.5"><i class="fas fa-wind" aria-hidden="true"></i><span id="weatherWind">--</span> km/h</span>
              <span class="flex items-center gap-1.5"><i class="fas fa-tint" aria-hidden="true"></i><span id="weatherHumidity">--</span>%</span>
              <span class="flex items-center gap-1.5"><i class="fas fa-cloud" aria-hidden="true"></i><span id="weatherClouds">--</span>%</span>
            </div>
          </div>
          <p class="text-slate-600 dark:text-white/20 text-xs mt-3 flex items-center gap-1.5"><i class="fas fa-database" aria-hidden="true"></i>Live data via Open-Meteo — falls back to a simulation if offline.</p>
        </div>
      </div>

      <footer class="app__footer"></footer>
    </div>
  </div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/session.js"></script>
  <script src="assets/js/nav-config.js"></script>
  <script src="assets/js/app-shell.js"></script>
  <script>
    It.app.boot(function(user) {
      if (user) {
        window.currentUser = user;
        window.isLoggedIn = true;
      }
    });
  </script>
  <script>
  (function () {
    const weatherResult = document.getElementById('weatherResult');
    const weatherError = document.getElementById('weatherError');

    const WMO_DESC = {
      0: 'Clear sky', 1: 'Mainly clear', 2: 'Partly cloudy', 3: 'Overcast',
      45: 'Fog', 48: 'Rime fog',
      51: 'Light drizzle', 53: 'Drizzle', 55: 'Dense drizzle',
      61: 'Light rain', 63: 'Rain', 65: 'Heavy rain', 66: 'Freezing rain', 67: 'Freezing rain',
      71: 'Light snow', 73: 'Snow', 75: 'Heavy snow', 77: 'Snow grains',
      80: 'Rain showers', 81: 'Heavy showers', 82: 'Violent showers',
      85: 'Snow showers', 86: 'Heavy snow showers',
      95: 'Thunderstorm', 96: 'Thunderstorm + hail', 99: 'Thunderstorm + heavy hail'
    };

    function simulateWeather(city) {
      const temps = [12, 18, 22, 26, 30, 8, 15, 20, 35, 28];
      const descs = ['Clear sky', 'Partly cloudy', 'Cloudy', 'Light rain', 'Sunny', 'Overcast', 'Windy', 'Foggy', 'Hot & dry', 'Mild breeze'];
      return {
        city: city,
        country: 'Simulated',
        temp: temps[Math.floor(Math.random() * temps.length)],
        desc: descs[Math.floor(Math.random() * descs.length)],
        wind: Math.floor(Math.random() * 30) + 5,
        humidity: Math.floor(Math.random() * 50) + 30,
        clouds: Math.floor(Math.random() * 100)
      };
    }

    function showWeather(data) {
      document.getElementById('weatherCity').textContent = data.city;
      document.getElementById('weatherCountry').textContent = data.country + (data._live ? ' · live' : ' · simulated');
      document.getElementById('weatherTemp').textContent = Math.round(data.temp) + '°C';
      document.getElementById('weatherDesc').textContent = data.desc;
      document.getElementById('weatherWind').textContent = data.wind;
      document.getElementById('weatherHumidity').textContent = data.humidity;
      document.getElementById('weatherClouds').textContent = data.clouds;
      weatherResult.classList.remove('hidden');
    }

    async function geocodeCity(name) {
      const url = 'https://geocoding-api.open-meteo.com/v1/search?name=' + encodeURIComponent(name) + '&count=1&language=en&format=json';
      const res = await fetch(url);
      if (!res.ok) throw new Error('geocoding failed');
      const data = await res.json();
      if (!data.results || !data.results.length) throw new Error('city not found');
      const r = data.results[0];
      return { lat: r.latitude, lon: r.longitude, name: r.name, country: r.country || '' };
    }

    async function searchWeather() {
      const input = document.getElementById('weatherInput').value.trim();
      if (!input) {
        weatherError.textContent = 'Please enter a city name.';
        weatherResult.classList.add('hidden');
        return;
      }
      weatherError.textContent = '';
      try {
        const geo = await geocodeCity(input);
        const res = await It.apiGet('/v1/weather?lat=' + geo.lat + '&lon=' + geo.lon);
        if (!res.ok) throw new Error('weather API failed');
        const data = res.body.data || {};
        
        showWeather({
          city: geo.name,
          country: geo.country,
          temp: data.temperature || 0,
          desc: data.description || 'Sunny',
          wind: data.wind || 0,
          humidity: data.humidity || '—',
          clouds: data.clouds || '—',
          _live: true
        });
      } catch (err) {
        showWeather(simulateWeather(input));
        weatherError.textContent = '⚠️ Live API unavailable (' + err.message + ') — showing simulated data.';
      }
    }

    document.getElementById('weatherSearchBtn').addEventListener('click', searchWeather);
    document.getElementById('weatherInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') searchWeather();
    });

    const cityParam = new URLSearchParams(window.location.search).get('city') || sessionStorage.getItem('itinera_weather_city');
    sessionStorage.removeItem('itinera_weather_city');
    if (cityParam) {
      document.getElementById('weatherInput').value = cityParam;
      searchWeather();
    }
  })();
</script>

</body>
</html>
