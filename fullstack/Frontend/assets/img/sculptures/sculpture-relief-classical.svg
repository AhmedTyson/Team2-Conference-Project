<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" fill="none" stroke="currentColor" opacity="0.06">
  <!-- Classical Sculptural Relief Profile & Laurel ("منحوتات كلاسيكية") -->
  <g stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Classical Head Contour -->
    <path d="M 300,120 C 230,120 180,180 180,260 C 180,310 195,350 210,380 C 215,390 220,410 215,430 C 205,470 190,520 160,560 C 140,585 110,610 80,630" />
    <path d="M 300,120 C 370,120 420,170 430,240 C 440,310 410,380 400,430 C 390,480 395,540 430,600 C 460,650 510,690 560,720" />
    
    <!-- Facial Profile Linework -->
    <path d="M 270,220 C 275,250 265,275 250,290 C 240,300 245,315 255,320 C 275,330 290,325 310,320" />
    <path d="M 252,292 L 230,340 C 228,345 232,352 238,352 L 255,352 C 245,368 245,378 258,382 C 275,386 295,375 315,370" />
    <path d="M 250,405 C 265,410 280,410 295,405" />
    <path d="M 245,430 C 260,450 285,455 315,445 C 335,438 350,420 360,395" />
    
    <!-- Classical Hair Curls & Sculptural Drapery -->
    <path d="M 280,140 C 240,150 210,185 205,225 C 225,215 250,215 270,225" />
    <path d="M 215,185 C 240,195 265,190 290,175 C 315,160 340,165 365,180" />
    <path d="M 305,145 C 340,155 375,175 390,210 C 370,215 350,210 335,195" />
    <path d="M 360,205 C 385,225 400,255 405,290 C 385,285 370,270 360,250" />
    
    <!-- Laurel Wreath Leaves ("إكليل الغار") -->
    <path d="M 220,160 C 205,140 215,120 235,125 C 245,140 235,155 220,160 Z" />
    <path d="M 255,135 C 245,115 260,95 278,105 C 285,120 272,135 255,135 Z" />
    <path d="M 295,120 C 290,100 310,85 328,95 C 330,115 315,125 295,120 Z" />
    <path d="M 335,125 C 338,105 360,98 375,112 C 372,130 355,135 335,125 Z" />
    <path d="M 370,145 C 380,128 402,128 412,145 C 405,160 388,160 370,145 Z" />

    <!-- Sculptural Pedestal & Bas-Relief Base -->
    <path d="M 120,680 L 480,680" stroke-width="1.8" />
    <path d="M 140,700 L 460,700" stroke-width="1.2" />
    <path d="M 100,720 L 500,720" stroke-width="2.2" />
    
    <!-- Delicate Hatching / Shading Lines -->
    <path d="M 270,470 L 290,460 M 265,485 L 295,470 M 260,500 L 300,480 M 255,515 L 305,490 M 250,530 L 310,500" opacity="0.6" />
    <path d="M 330,470 L 350,460 M 325,485 L 355,470 M 320,500 L 360,480 M 315,515 L 365,490" opacity="0.6" />
  </g>
</svg>
