<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 800" fill="none" stroke="currentColor" opacity="0.05">
  <!-- Classical Architectural Fluting & Volute ("منحوتات وعمارة كلاسيكية") -->
  <g stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Capital Volutes -->
    <path d="M 40,80 C 40,50 70,40 100,55 C 120,65 115,95 90,95 C 75,95 70,80 82,72 C 90,68 95,74 92,78" />
    <path d="M 260,80 C 260,50 230,40 200,55 C 180,65 185,95 210,95 C 225,95 230,80 218,72 C 210,68 205,74 208,78" />
    <path d="M 80,60 L 220,60 M 30,85 L 270,85 M 50,110 L 250,110" />

    <!-- Vertical Column Fluting Lines -->
    <line x1="60" y1="110" x2="60" y2="720" stroke-width="1.5" />
    <line x1="85" y1="110" x2="85" y2="720" stroke-width="1.2" />
    <line x1="110" y1="110" x2="110" y2="720" stroke-width="1.5" />
    <line x1="135" y1="110" x2="135" y2="720" stroke-width="1.2" />
    <line x1="150" y1="110" x2="150" y2="720" stroke-width="2.0" />
    <line x1="165" y1="110" x2="165" y2="720" stroke-width="1.2" />
    <line x1="190" y1="110" x2="190" y2="720" stroke-width="1.5" />
    <line x1="215" y1="110" x2="215" y2="720" stroke-width="1.2" />
    <line x1="240" y1="110" x2="240" y2="720" stroke-width="1.5" />

    <!-- Column Base Plinth -->
    <path d="M 45,720 L 255,720 stroke-width=1.8" />
    <path d="M 35,740 L 265,740 stroke-width=2.0" />
    <path d="M 20,765 L 280,765 stroke-width=2.5" />
  </g>
</svg>
