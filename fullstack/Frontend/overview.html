<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Itinera – My Trips</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="assets/css/tokens.css" />
    <link rel="stylesheet" href="assets/css/common.css" />
    <link rel="stylesheet" href="assets/css/overview.css" />
  <script>/* FOUC prevention — default dark */
    (function(){var k="itinera_theme",s;try{s=localStorage.getItem(k);}catch(e){}
    if(!s||s==="dark"||(s==="system"&&window.matchMedia&&window.matchMedia("(prefers-color-scheme:dark)").matches))
      document.documentElement.classList.add("dark","fouc-ready");
    else document.documentElement.classList.add("fouc-ready");
    })();
  </script>  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body data-page="overview" data-auth="protected" data-layout="public">
  <header class="app-nav-header"></header>

    <nav class="sidebar" id="sidebar"></nav>

    <div class="main">
        <div class="flex-between mb-16">
            <h1 class="page-title">My Trips <small>Overview</small></h1>
            <div style="display:flex; align-items:center; gap:0.75rem;">
                <button type="button" id="theme-toggle" class="icon-btn theme-toggle" aria-label="Toggle theme">
                  <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/><line x1="4.9" y1="4.9" x2="6.3" y2="6.3"/><line x1="17.7" y1="17.7" x2="19.1" y2="19.1"/><line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/><line x1="4.9" y1="19.1" x2="6.3" y2="17.7"/><line x1="17.7" y1="6.3" x2="19.1" y2="4.9"/></svg>
                  <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
                </button>
                <a class="btn btn-dark" href="create-trip.html">
                    <i class="fas fa-plus"></i> Create Trip
                </a>
            </div>
        </div>

        <div class="card trips-card">
            <div id="tripsList">
                <div class="empty-state"><i class="fas fa-spinner fa-spin"></i> Loading trips…</div>
            </div>
        </div>

        <div class="mt-16 placeholder">
            <i class="fas fa-info-circle"></i> <span id="tripsCountText">0 trips</span>
        </div>
    </div>

    <script src="js/common.js"></script>
    <script src="js/overview.js"></script>
  <script src="./assets/js/core/theme.js"></script>
  <script src="./assets/js/core/navbar-component.js"></script>
  <script src="assets/js/core/topbar.js"></script>
  <script src="./assets/js/core/footer-component.js"></script>
</body>
</html>
