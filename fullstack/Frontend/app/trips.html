<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Trips · Itinera</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <!-- Font Awesome 6 Free -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- Custom Luxury Stylesheet -->
  <link rel="stylesheet" href="../assets/css/public.css" />
  <script>
    /* FOUC prevention — default dark */
    (function(){
      var k = "itinari_theme", s;
      try { s = localStorage.getItem(k); } catch(e) {}
      if (!s || s === "dark" || (s === "system" && window.matchMedia && window.matchMedia("(prefers-color-scheme:dark)").matches))
        document.documentElement.classList.add("dark", "fouc-ready");
      else document.documentElement.classList.add("fouc-ready");
    })();
  </script>
</head>
<body class="bg-[#0a0a0a] text-white min-h-screen selection:bg-amber-400 selection:text-black" data-layout="app">

  <div class="app-wrapper flex flex-col min-h-screen">

    <!-- Top Navigation Header -->
    <header class="app-nav-header sticky top-0 z-50 backdrop-blur-md bg-black/60 border-b border-white/10"></header>

    <!-- Main Container -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-10">
      
      <!-- Hero Header Section -->
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-6 border-b border-white/10 pb-8 mb-10">
        <div>
          <span class="px-3.5 py-1.5 rounded-full bg-amber-400/10 border border-amber-400/20 text-amber-400 text-xs font-bold uppercase tracking-widest inline-flex items-center gap-1.5 mb-3">
            <i class="fas fa-suitcase-rolling"></i> Personal Travel Itineraries
          </span>
          <h1 class="text-3xl sm:text-5xl font-black tracking-tight text-white">Your Travel Trips</h1>
          <p class="text-white/60 text-sm sm:text-base mt-2 max-w-2xl">
            Every journey you've planned — organize dates, attach luxury stays, dining, and curated sights.
          </p>
        </div>

        <a href="trip-form.html" class="px-6 py-3 rounded-full bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-black font-bold text-xs shadow-lg shadow-amber-500/20 transition-all flex items-center justify-center gap-2 flex-shrink-0">
          <i class="fas fa-plus"></i> Plan a New Trip
        </a>
      </div>

      <!-- Trip Filter Pills -->
      <div class="flex items-center gap-2.5 overflow-x-auto pb-3 mb-8 scrollbar-none" id="trip-filter-pills">
        <button class="px-4 py-2 rounded-full bg-amber-400 text-black font-bold text-xs shadow-md transition flex-shrink-0 cursor-pointer" data-status="all">All Trips</button>
        <button class="px-4 py-2 rounded-full bg-white/5 hover:bg-white/10 border border-white/10 text-white/70 font-semibold text-xs transition flex-shrink-0 cursor-pointer" data-status="planning">Planning</button>
        <button class="px-4 py-2 rounded-full bg-white/5 hover:bg-white/10 border border-white/10 text-white/70 font-semibold text-xs transition flex-shrink-0 cursor-pointer" data-status="booked">Booked</button>
        <button class="px-4 py-2 rounded-full bg-white/5 hover:bg-white/10 border border-white/10 text-white/70 font-semibold text-xs transition flex-shrink-0 cursor-pointer" data-status="completed">Completed</button>
      </div>

      <!-- Trips Grid Container -->
      <div id="trip-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Skeleton Loader -->
        <div class="rounded-3xl bg-white/5 border border-white/10 p-6 animate-pulse space-y-4 h-56">
          <div class="h-6 w-1/3 bg-white/10 rounded-full"></div>
          <div class="h-8 w-3/4 bg-white/10 rounded-full"></div>
          <div class="h-4 w-1/2 bg-white/10 rounded-full"></div>
        </div>
        <div class="rounded-3xl bg-white/5 border border-white/10 p-6 animate-pulse space-y-4 h-56">
          <div class="h-6 w-1/3 bg-white/10 rounded-full"></div>
          <div class="h-8 w-3/4 bg-white/10 rounded-full"></div>
          <div class="h-4 w-1/2 bg-white/10 rounded-full"></div>
        </div>
      </div>

    </main>

    <!-- Footer -->
    <footer class="app-footer border-t border-white/10 bg-black/40 py-8 mt-20">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between text-xs text-white/40 gap-4">
        <span>&copy; <span id="footerYear"></span> Itinera · Personal Itinerary Planner. All rights reserved.</span>
        <div class="flex gap-6 font-medium">
          <a href="../about.html" class="hover:text-amber-400 transition">About</a>
          <a href="../contact.html" class="hover:text-amber-400 transition">Contact</a>
          <a href="../help.html" class="hover:text-amber-400 transition">Help Center</a>
        </div>
      </div>
    </footer>

  </div>

  <!-- Scripts -->
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/session.js"></script>
  <script src="../assets/js/nav-config.js"></script>
  <script src="../assets/js/trips.js"></script>
  <script src="../assets/js/core/navbar-component.js"></script>
  <script src="../assets/js/core/topbar.js"></script>
  <script src="../assets/js/core/theme.js"></script>
</body>
</html>
