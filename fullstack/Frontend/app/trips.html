<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Trips · Travel Planner</title>
  <link rel="stylesheet" href="../assets/css/tokens.css" />
  <link rel="stylesheet" href="../assets/css/app.css" />
  <script>/* FOUC prevention — default dark */
    (function(){var k="itinari_theme",s;try{s=localStorage.getItem(k);}catch(e){}
    if(!s||s==="dark"||(s==="system"&&window.matchMedia&&window.matchMedia("(prefers-color-scheme:dark)").matches))
      document.documentElement.classList.add("dark","fouc-ready");
    else document.documentElement.classList.add("fouc-ready");
    })();
  </script>  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body data-page="trips" class="is-booting" data-layout="app">
  <div class="app">
    <!-- Top Navigation Header -->
    <header class="app-nav-header"></header>
      <div id="app-user" class="app__user">
        <button id="theme-toggle" type="button" class="btn btn--ghost" aria-label="Toggle theme">◐</button>
      </div>
    </header>

    <main class="app__main">
      <div class="page">
        <header class="page-header" style="display:flex;justify-content:space-between;align-items:flex-end;gap:var(--space-4);">
          <div>
            <p class="page-header__eyebrow">Itineraries</p>
            <h1 class="page-header__title">Your trips</h1>
            <p class="page-header__lead">Every plan you've sketched out — attach stays, meals and sights as you go.</p>
          </div>
          <a href="/trip-form.html" class="btn btn--primary">New trip</a>
        </header>

        <div id="trip-list" class="trip-list">
          <div class="skeleton skeleton--card"></div>
          <div class="skeleton skeleton--card"></div>
        </div>
      </div>
    </main>

    <footer class="app__footer">
      <span>Travel Planner</span>
      <span>•</span>
      <span>Plan. Explore. Remember.</span>
    </footer>
  </div>

  <script src="../assets/js/core/config.js"></script>
  <script src="../assets/js/core/api.js"></script>
  <script src="../assets/js/core/session.js"></script>
  <script src="../assets/js/core/nav-config.js"></script>
  <script src="../assets/js/core/app-shell.js"></script>
  <script src="../assets/js/trips.js"></script>
  <script src="../assets/js/core/navbar-component.js"></script>
  <script src="../assets/js/core/topbar.js"></script>
  <script src="../assets/js/core/theme.js"></script>
  </body>
</html>
