<!DOCTYPE html>
<html lang="en" data-theme-luxury>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plan a New Trip · Travel Planner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..800;1,9..144,400..800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/tokens.css" />
  <link rel="stylesheet" href="../assets/css/app.css" />
  <link rel="stylesheet" href="../assets/css/luxury-theme.css" />
  <script>/* FOUC prevention — default dark */
    (function(){var k="itinari_theme",s;try{s=localStorage.getItem(k);}catch(e){}
    if(!s||s==="dark"||(s==="system"&&window.matchMedia&&window.matchMedia("(prefers-color-scheme:dark)").matches))
      document.documentElement.classList.add("dark","fouc-ready");
    else document.documentElement.classList.add("fouc-ready");
    })();
  </script></head>
<body data-page="trips" class="is-booting" data-layout="app">
  <div class="app">
    <header class="app__header">
      <a id="app-brand" class="app__brand" href="/home.html"></a>
      <nav id="app-nav" class="nav" aria-label="Main navigation"></nav>
      <div id="app-user" class="app__user">
        <button id="theme-toggle" type="button" class="btn btn--ghost" aria-label="Toggle theme">◐</button>
      </div>
    </header>

    <main class="app__main">
      <div class="page">
        <header class="page-header">
          <p class="page-header__eyebrow">Itineraries</p>
          <h1 class="page-header__title">Plan a new trip</h1>
          <p class="page-header__lead">Sketch the skeleton — you can attach hotels, restaurants and sights afterwards.</p>
        </header>

        <form class="form" id="trip-form" novalidate>
          <div class="form__card">
            <div class="field">
              <label class="field__label" for="trip-title">Trip title</label>
              <input id="trip-title" class="input" type="text" maxlength="255" placeholder="e.g. Nile Explorer" autocomplete="off" />
              <p class="field__error" id="title-error" hidden></p>
            </div>

            <div class="field">
              <span class="field__label">Travel style</span>
              <div class="chip-row" id="style-chips"></div>
              <p class="field__error" id="style-error" hidden></p>
            </div>

            <div class="field">
              <span class="field__label">Interests <span class="field__hint" id="interests-count">0 selected</span></span>
              <div class="chip-row chip-row--wrap" id="interest-chips"></div>
              <p class="field__error" id="interests-error" hidden></p>
            </div>

            <div class="form__grid">
              <div class="field">
                <label class="field__label" for="trip-travelers">Travelers</label>
                <input id="trip-travelers" class="input" type="number" min="1" value="2" />
              </div>
              <div class="field">
                <label class="field__label" for="trip-budget">Budget <span class="field__hint">in your currency</span></label>
                <input id="trip-budget" class="input" type="number" min="0" step="0.01" placeholder="0.00" />
                <p class="field__error" id="budget-error" hidden></p>
              </div>
              <div class="field">
                <label class="field__label" for="trip-days">Days</label>
                <input id="trip-days" class="input" type="number" min="1" value="3" />
              </div>
            </div>

            <div class="form__grid">
              <div class="field">
                <label class="field__label" for="trip-start">Start date</label>
                <input id="trip-start" class="input" type="date" />
                <p class="field__error" id="start-error" hidden></p>
              </div>
              <div class="field">
                <label class="field__label" for="trip-end">End date <span class="field__hint">auto-fills from the day count</span></label>
                <input id="trip-end" class="input" type="date" />
                <p class="field__error" id="end-error" hidden></p>
              </div>
            </div>

            <div class="btn-row">
              <a href="/trips.html" class="btn btn--ghost">Cancel</a>
              <button type="submit" class="btn btn--primary">Create trip</button>
            </div>
          </div>
        </form>
      </div>
    </main>

    <footer class="app__footer">
      <span>Travel Planner</span>
      <span>•</span>
      <span>Plan. Explore. Remember.</span>
    </footer>
  </div>

  <script src="../assets/js/core/config.js"></script>
  <script src="../assets/js/core/api.js"></script>
  <script src="../assets/js/core/session.js"></script>
  <script src="../assets/js/core/nav-config.js"></script>
  <script src="../assets/js/core/app-shell.js"></script>
  <script src="../assets/js/trip-form.js"></script>
  </body>
</html>
