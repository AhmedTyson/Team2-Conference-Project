<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Traveler Survey · Travel Planner</title>
  <link rel="stylesheet" href="../assets/css/tokens.css" />
  <link rel="stylesheet" href="../assets/css/app.css" />
  <script>/* FOUC prevention — default dark */
    (function(){var k="itinera_theme",s;try{s=localStorage.getItem(k);}catch(e){}
    if(!s||s==="dark"||(s==="system"&&window.matchMedia&&window.matchMedia("(prefers-color-scheme:dark)").matches))
      document.documentElement.classList.add("dark","fouc-ready");
    else document.documentElement.classList.add("fouc-ready");
    })();
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body data-page="survey" class="is-booting" data-layout="app">
  <div class="app">
    <!-- Top Navigation Header -->
    <header class="app-nav-header"></header>

    <main class="app__main">
      <div class="page">
        <header class="page-header">
          <p class="page-header__eyebrow">Preferences</p>
          <h1 class="page-header__title">Traveler preference survey</h1>
          <p class="page-header__lead">View your saved travel preference profile.</p>
        </header>

        <div id="survey-details" class="card p-6 rounded-2xl bg-white/5 border border-white/10">
          <div class="skeleton skeleton--card mb-3"></div>
          <div class="skeleton skeleton--line"></div>
        </div>
      </div>
    </main>

    <footer class="app-footer"></footer>
  </div>

  <script src="../assets/js/core/config.js"></script>
  <script src="../assets/js/core/api.js"></script>
  <script src="../assets/js/core/session.js"></script>
  <script src="../assets/js/core/nav-config.js"></script>
  <script src="../assets/js/core/app-shell.js"></script>
  <script src="../assets/js/survey.js"></script>
  <script src="../assets/js/core/navbar-component.js"></script>
  <script src="../assets/js/core/footer-component.js"></script>
</body>
</html>
