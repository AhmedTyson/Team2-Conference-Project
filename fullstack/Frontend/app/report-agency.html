<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Report an Agency · Travel Planner</title>
  <link rel="stylesheet" href="../assets/css/tokens.css" />
  <link rel="stylesheet" href="../assets/css/app.css" />
  <script>/* FOUC prevention — default dark */
    (function(){var k="itinera_theme",s;try{s=localStorage.getItem(k);}catch(e){}
    if(!s||s==="dark"||(s==="system"&&window.matchMedia&&window.matchMedia("(prefers-color-scheme:dark)").matches))
      document.documentElement.classList.add("dark","fouc-ready");
    else document.documentElement.classList.add("fouc-ready");
    })();
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body data-page="report" class="is-booting" data-layout="app">
  <div class="app">
    <!-- Top Navigation Header -->
    <header class="app-nav-header"></header>

    <main class="app__main">
      <div class="page">
        <header class="page-header">
          <p class="page-header__eyebrow">Consumer Protection</p>
          <h1 class="page-header__title">Report an agency issue</h1>
          <p class="page-header__lead">File a consumer report regarding travel agency service violations, non-refunds, or misconduct.</p>
        </header>

        <form class="form" id="agency-report-form" novalidate>
          <div class="form__card border border-white/10 p-6 rounded-2xl bg-white/5">
            <div class="field mb-4">
              <label class="field__label block text-xs font-bold text-white/70 uppercase mb-1" for="agency-select">Select Agency</label>
              <select id="agency-select" class="input w-full px-4 py-2.5 rounded-xl bg-white/5 border border-white/10 text-white text-sm" required>
                <option value="">-- Choose Agency --</option>
              </select>
            </div>

            <div class="field mb-4">
              <label class="field__label block text-xs font-bold text-white/70 uppercase mb-1" for="report-reason">Reason for Report</label>
              <input id="report-reason" class="input w-full px-4 py-2.5 rounded-xl bg-white/5 border border-white/10 text-white text-sm" type="text" placeholder="e.g. Unfulfilled itinerary, hidden fees, cancelled booking" required />
            </div>

            <div class="field mb-6">
              <label class="field__label block text-xs font-bold text-white/70 uppercase mb-1" for="report-details">Detailed Explanation</label>
              <textarea id="report-details" class="input w-full px-4 py-2.5 rounded-xl bg-white/5 border border-white/10 text-white text-sm" rows="5" placeholder="Provide dates, booking reference numbers, and specific details..." required></textarea>
            </div>

            <div class="btn-row flex justify-end">
              <button type="submit" class="btn px-6 py-3 rounded-xl bg-rose-500 hover:bg-rose-400 text-white font-bold text-sm transition">Submit Official Report</button>
            </div>
          </div>
        </form>
      </div>
    </main>

    <footer class="app-footer"></footer>
  </div>

  <script src="../assets/js/core/config.js"></script>
  <script src="../assets/js/core/api.js"></script>
  <script src="../assets/js/core/session.js"></script>
  <script src="../assets/js/core/nav-config.js"></script>
  <script src="../assets/js/core/app-shell.js"></script>
  <script src="../assets/js/report-agency.js"></script>
  <script src="../assets/js/core/navbar-component.js"></script>
  <script src="../assets/js/core/footer-component.js"></script>
</body>
</html>
