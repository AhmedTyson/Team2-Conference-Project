<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Receipt · Itinera</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <!-- Font Awesome 6 (free) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

  <!-- Shared styles -->
  <link rel="stylesheet" href="../assets/css/tokens.css" />
  <link rel="stylesheet" href="../assets/css/public.css" />
  <link rel="stylesheet" href="../assets/css/app.css" />

  <style>
    .receipt-card { max-width: 560px; margin: 0 auto; }
    .receipt-row { display: flex; justify-content: space-between; align-items: center; padding: 0.55rem 0; font-size: 0.85rem; color: hsl(var(--muted-foreground)); border-bottom: 1px dashed hsl(var(--border)); }
    .receipt-row:last-child { border-bottom: none; }
    .receipt-row .val { color: hsl(var(--foreground)); font-weight: 600; }
    .receipt-stamp { width: 92px; height: 92px; border: 2px solid rgba(74, 222, 128, 0.5); color: rgba(74, 222, 128, 0.85); border-radius: 999px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 800; font-size: 0.7rem; letter-spacing: 0.12em; transform: rotate(-12deg); margin: 0 auto; }
    .receipt-stamp i { font-size: 1.4rem; margin-bottom: 0.2rem; }
    .pulse-dot { width: 10px; height: 10px; border-radius: 999px; background: #f59e0b; display: inline-block; animation: pulse 1.4s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
    @media print {
      nav, .giant-text, .footer, .btn-outline, .btn-primary, .no-print, header, footer { display: none !important; }
      body { background: #fff !important; color: #000 !important; }
      .receipt-card { border: none !important; box-shadow: none !important; background: #fff !important; }
      .receipt-card h3, .receipt-card .val, .receipt-row, .receipt-card p { color: #0b1a33 !important; }
      .receipt-stamp { border-color: #16a34a !important; color: #16a34a !important; }
      .content-layer, .page-scroll, .app-wrapper { background: #fff !important; }
    }
  </style>

  <script>window.APP_URL = ".";</script>
  <script src="../assets/js/core/config.js"></script>
  <script src="../assets/js/core/api.js"></script>
  <script src="../assets/js/core/session.js"></script>
  <script src="../js/plans-core.js"></script>
  <script>window.Itinera && (window.Itinera.CONFIG.publicPage = false);</script>
  <script>/* FOUC prevention — default dark */
    (function(){var k="itinera_theme",s;try{s=localStorage.getItem(k);}catch(e){}
    if(!s||s==="dark"||(s==="system"&&window.matchMedia&&window.matchMedia("(prefers-color-scheme:dark)").matches))
      document.documentElement.classList.add("dark","fouc-ready");
    else document.documentElement.classList.add("fouc-ready");
    })();
  </script>
</head>
<body class="bg-[#0a0a0a] text-white" data-layout="app">

  <div class="toast" id="toast">
    <i class="fas fa-check-circle text-green-400" aria-hidden="true"></i>
    <span id="toastMessage">Success</span>
  </div>

  <div class="page-scroll min-h-screen flex flex-col justify-between">
    <div class="content-layer max-w-6xl mx-auto px-6 py-6 w-full flex-1">
      <header class="app-nav-header"></header>

      <div class="max-w-4xl mx-auto w-full mt-6">
        <div class="text-center mb-8">
          <h2 class="text-3xl font-black text-white">Order Receipt & Confirmation</h2>
          <p class="text-sm text-white/50 mt-1">Live subscription and payment status from your Itinera account.</p>
        </div>

        <div id="receiptRoot"></div>
      </div>
    </div>

    <!-- Footer -->
    <footer class="app-footer"></footer>
  </div>

  <script src="../js/app.js"></script>
  <script src="../js/receipt.js"></script>
  <script src="../assets/js/core/navbar-component.js"></script>
  <script src="../assets/js/core/topbar.js"></script>
  <script src="../assets/js/core/theme.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      var y = document.getElementById("footerYear");
      if (y) y.textContent = new Date().getFullYear();
    });
  </script>
  <script src="../assets/js/core/footer-component.js"></script>
</body>
</html>
