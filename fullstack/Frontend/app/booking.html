<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Booking · Itinera</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <!-- Font Awesome 6 (free) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

  <!-- Shared styles -->
  <link rel="stylesheet" href="../assets/css/tokens.css" />
  <link rel="stylesheet" href="../assets/css/app.css" />

  <script>/* FOUC prevention — default dark */
    (function(){var k="itinera_theme",s;try{s=localStorage.getItem(k);}catch(e){}
    if(!s||s==="dark"||(s==="system"&&window.matchMedia&&window.matchMedia("(prefers-color-scheme:dark)").matches))
      document.documentElement.classList.add("dark","fouc-ready");
    else document.documentElement.classList.add("fouc-ready");
    })();
  </script>
</head>
<body class="page is-booting" data-layout="app">

  <!-- Top Navigation Header -->
  <header class="app-nav-header"></header>

  <div class="toast" id="toast">
    <i class="fas fa-check-circle text-green-400" aria-hidden="true"></i>
    <span id="toastMessage">Success</span>
  </div>

  <div class="page-scroll" style="padding-top: 80px;">
    <div class="giant-text"><h1>BOOKING</h1></div>

    <main class="page__content">
      <section class="section">
        <h2 class="section__title font-heading font-black tracking-tight" id="booking-heading">Complete your reservation</h2>
        <div id="booking-item-details" class="card mb-6" style="padding: 1.5rem; display: none;"></div>

        <form class="form" id="booking-form" novalidate>
          <div class="form__card border border-white/10 p-6 rounded-2xl bg-white/5">
            <div class="field mb-4">
              <label class="field__label block text-xs font-bold text-white/70 uppercase mb-1" for="book-name">Full Name</label>
              <input id="book-name" class="input w-full px-4 py-2.5 rounded-xl bg-white/5 border border-white/10 text-white text-sm" type="text" maxlength="255" required />
            </div>

            <div class="field mb-4">
              <label class="field__label block text-xs font-bold text-white/70 uppercase mb-1" for="book-email">Email Address</label>
              <input id="book-email" class="input w-full px-4 py-2.5 rounded-xl bg-white/5 border border-white/10 text-white text-sm" type="email" maxlength="255" required />
            </div>

            <div class="field mb-4">
              <label class="field__label block text-xs font-bold text-white/70 uppercase mb-1" for="book-phone">Phone Number</label>
              <input id="book-phone" class="input w-full px-4 py-2.5 rounded-xl bg-white/5 border border-white/10 text-white text-sm" type="tel" maxlength="50" placeholder="+20 100 123 4567" required />
            </div>

            <div class="field mb-4">
              <label class="field__label block text-xs font-bold text-white/70 uppercase mb-1" for="book-guests">Number of Guests</label>
              <input id="book-guests" class="input w-full px-4 py-2.5 rounded-xl bg-white/5 border border-white/10 text-white text-sm" type="number" min="1" max="20" value="1" required />
            </div>

            <div class="field mb-6">
              <label class="field__label block text-xs font-bold text-white/70 uppercase mb-1" for="book-notes">Special Requests / Notes</label>
              <textarea id="book-notes" class="input w-full px-4 py-2.5 rounded-xl bg-white/5 border border-white/10 text-white text-sm" rows="3" placeholder="Dietary requirements, room preferences, arrival times..."></textarea>
            </div>

            <div class="btn-row flex justify-end gap-3">
              <button type="submit" class="btn px-6 py-3 rounded-xl bg-amber-400 hover:bg-amber-300 text-slate-950 font-bold text-sm transition">Proceed to Paymob Payment</button>
            </div>
          </div>
        </form>
      </section>
    </main>

    <footer class="app-footer"></footer>
  </div>

  <script src="../assets/js/core/config.js"></script>
  <script src="../assets/js/core/api.js"></script>
  <script src="../assets/js/core/session.js"></script>
  <script src="../assets/js/core/nav-config.js"></script>
  <script src="../assets/js/booking.js"></script>
  <script src="../assets/js/core/navbar-component.js"></script>
  <script src="../assets/js/core/footer-component.js"></script>
</body>
</html>
