<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Reviews · Travel Planner</title>
  <link rel="stylesheet" href="../assets/css/tokens.css" />
  <link rel="stylesheet" href="../assets/css/app.css" />
  <script>/* FOUC prevention — default dark */
    (function(){var k="itinari_theme",s;try{s=localStorage.getItem(k);}catch(e){}
    if(!s||s==="dark"||(s==="system"&&window.matchMedia&&window.matchMedia("(prefers-color-scheme:dark)").matches))
      document.documentElement.classList.add("dark","fouc-ready");
    else document.documentElement.classList.add("fouc-ready");
    })();
  </script></head>
<body data-page="reviews" class="is-booting" data-layout="app">
  <div class="app">
    <header class="app__header">
      <a id="app-brand" class="app__brand" href="/home.html"></a>
      <nav id="app-nav" class="nav" aria-label="Main navigation"></nav>
      <div id="app-user" class="app__user">
        <button id="theme-toggle" type="button" class="btn btn--ghost" aria-label="Toggle theme">◐</button>
      </div>
    </header>

    <main class="app__main">
      <div class="page">
        <header class="page-header" style="display:flex;justify-content:space-between;align-items:flex-end;gap:var(--space-4);">
          <div>
            <p class="page-header__eyebrow">Moderation</p>
            <h1 class="page-header__title">My reviews</h1>
            <p class="page-header__lead">Everything you've rated — pending ones go live once approved by the team.</p>
          </div>
          <a href="/explore.html" class="btn btn--primary">Write a review</a>
        </header>

        <div id="review-list" class="review-list">
          <div class="skeleton skeleton--card"></div>
          <div class="skeleton skeleton--card"></div>
        </div>
      </div>
    </main>

    <footer class="app__footer">
      <span>Travel Planner</span>
      <span>•</span>
      <span>Plan. Explore. Remember.</span>
    </footer>
  </div>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/session.js"></script>
  <script src="../assets/js/nav-config.js"></script>
  <script src="../assets/js/app-shell.js"></script>
  <script src="../assets/js/my-reviews.js"></script>
  <script src="../assets/js/core/topbar.js"></script>
  <script src="../assets/js/core/theme.js"></script>
</body>
</html>
