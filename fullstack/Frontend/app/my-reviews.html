<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Reviews · Itinera</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..800;1,9..144,400..800&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  
  <!-- Font Awesome 6 (free) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- Shared styles -->
  <link rel="stylesheet" href="../assets/css/tokens.css" />
  <link rel="stylesheet" href="../assets/css/app.css" />
  
  <style>
    .review-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.09);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 1rem;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    .review-card:hover {
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, 0.18);
    }
    html.dark .review-card {
      background: rgba(18, 18, 18, 0.7);
      border-color: rgba(255, 255, 255, 0.08);
    }
    .badge-pending {
      background: rgba(245, 158, 11, 0.15);
      color: #fcd34d;
      border: 1px solid rgba(245, 158, 11, 0.3);
    }
    .badge-approved {
      background: rgba(34, 197, 94, 0.15);
      color: #86efac;
      border: 1px solid rgba(34, 197, 94, 0.3);
    }
    .badge-rejected {
      background: rgba(239, 68, 68, 0.15);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
  </style>

  <script>/* FOUC prevention — default dark */
    (function(){var k="itinera_theme",s;try{s=localStorage.getItem(k);}catch(e){}
    if(!s||s==="dark"||(s==="system"&&window.matchMedia&&window.matchMedia("(prefers-color-scheme:dark)").matches))
      document.documentElement.classList.add("dark","fouc-ready");
    else document.documentElement.classList.add("fouc-ready");
    })();
  </script>
</head>
<body data-page="reviews" class="bg-[#0a0a0a] text-white min-h-screen flex flex-col" data-layout="app">
  <div class="app flex-1 flex flex-col">
    <!-- Top Navigation Header -->
    <header class="app-nav-header"></header>

    <main class="app__main flex-1 max-w-6xl mx-auto px-6 py-10 w-full">
      <div class="page space-y-8">
        <header class="flex flex-col md:flex-row md:items-end justify-between gap-4 border-b border-white/10 pb-6">
          <div>
            <p class="text-xs uppercase tracking-widest text-amber-400 font-semibold mb-1">Traveler Feedback</p>
            <h1 class="text-3xl font-black tracking-tight text-white">My Reviews & Ratings</h1>
            <p class="text-sm text-white/50 mt-1">Track all your submitted ratings — pending reviews will appear on public catalog pages once approved by our moderation team.</p>
          </div>
          <a href="../explore.html" class="inline-flex items-center gap-2 bg-amber-500 hover:bg-amber-400 text-black font-bold px-5 py-2.5 rounded-full transition shadow-lg text-sm">
            <i class="fas fa-plus"></i>
            <span>Write a Review</span>
          </a>
        </header>

        <div id="review-list" class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="review-card p-6 animate-pulse space-y-3">
            <div class="h-4 bg-white/10 rounded w-1/4"></div>
            <div class="h-6 bg-white/10 rounded w-3/4"></div>
            <div class="h-4 bg-white/10 rounded w-1/2"></div>
          </div>
          <div class="review-card p-6 animate-pulse space-y-3">
            <div class="h-4 bg-white/10 rounded w-1/4"></div>
            <div class="h-6 bg-white/10 rounded w-3/4"></div>
            <div class="h-4 bg-white/10 rounded w-1/2"></div>
          </div>
        </div>
      </div>
    </main>

    <footer class="app-footer"></footer>
  </div>

  <script src="../assets/js/core/config.js"></script>
  <script src="../assets/js/core/api.js"></script>
  <script src="../assets/js/core/session.js"></script>
  <script src="../assets/js/core/nav-config.js"></script>
  <script src="../assets/js/core/app-shell.js"></script>
  <script src="../assets/js/my-reviews.js"></script>
  <script src="../assets/js/core/navbar-component.js"></script>
  <script src="../assets/js/core/topbar.js"></script>
  <script src="../assets/js/core/theme.js"></script>
    <script src="../assets/js/core/footer-component.js"></script>
</body>
</html>
