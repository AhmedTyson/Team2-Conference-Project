<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment Success · Itinera Travel</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

  <!-- Shared styles -->
  <link rel="stylesheet" href="../assets/css/tokens.css" />
  <link rel="stylesheet" href="../assets/css/public.css" />
  <link rel="stylesheet" href="../assets/css/app.css" />

  <style>
    .success-card { max-width: 620px; margin: 0 auto; }
    .status-badge-paid {
      background: linear-gradient(135deg, rgba(34, 197, 94, 0.15), rgba(16, 185, 129, 0.25));
      border: 1px solid rgba(74, 222, 128, 0.4);
    }
    .status-badge-failed {
      background: linear-gradient(135deg, rgba(239, 68, 68, 0.15), rgba(225, 29, 72, 0.25));
      border: 1px solid rgba(248, 113, 113, 0.4);
    }
    .check-ring {
      width: 80px; height: 80px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1.25rem;
      animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    @keyframes pulse-ring {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.85; }
    }
    .detail-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 0.65rem 0; font-size: 0.875rem;
      border-bottom: 1px dashed rgba(255, 255, 255, 0.1);
    }
    .detail-row:last-child { border-bottom: none; }
  </style>

  <script>window.APP_URL = ".";</script>
  <script src="../assets/js/core/config.js"></script>
  <script src="../assets/js/core/api.js"></script>
  <script src="../assets/js/core/session.js"></script>
  <script src="../js/plans-core.js"></script>
  <script>
    /* FOUC prevention — default dark */
    (function(){var k="itinari_theme",s;try{s=localStorage.getItem(k);}catch(e){}
    if(!s||s==="dark"||(s==="system"&&window.matchMedia&&window.matchMedia("(prefers-color-scheme:dark)").matches))
      document.documentElement.classList.add("dark","fouc-ready");
    else document.documentElement.classList.add("fouc-ready");
    })();
  </script>
</head>
<body class="bg-[#0a0a0a] text-white min-h-screen flex flex-col" data-layout="app">

  <div class="app-wrapper flex-1 flex flex-col justify-between pt-6 pb-8">
    <main class="content-layer max-w-4xl mx-auto px-4 w-full flex-1 flex flex-col justify-center my-auto">

      <div id="successCardRoot" class="success-card glass-card p-8 md:p-10 rounded-2xl border border-white/10 shadow-2xl relative overflow-hidden">
        <!-- Card Skeleton loader -->
        <div id="cardLoader" class="text-center py-12">
          <i class="fas fa-spinner fa-spin text-4xl text-amber-400 mb-4"></i>
          <p class="text-sm text-white/60">Verifying payment details with Paymob gateway...</p>
        </div>
      </div>

    </main>

    <!-- Footer -->
    <footer class="app-footer mt-8 py-4 border-t border-white/10 text-xs text-white/35 text-center">
      <span>&copy; <span id="footerYear"></span> Itinera · Team 2 Conference Project. All rights reserved.</span>
    </footer>
  </div>

  <script src="../js/app.js"></script>
  <script src="../assets/js/core/navbar-component.js"></script>
  <script src="../assets/js/core/topbar.js"></script>
  <script src="../assets/js/core/theme.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      var y = document.getElementById("footerYear");
      if (y) y.textContent = new Date().getFullYear();

      const params = new URLSearchParams(window.location.search);
      const querySuccess = params.get("success") === "true" || params.get("txn_response_code") === "APPROVED" || params.get("pending") === "false";
      const paramOrderRef = params.get("merchant_order_id") || params.get("order_id") || params.get("order") || params.get("id");
      const root = document.getElementById("successCardRoot");

      function renderCard(data) {
        const isSuccess = data.isSuccess;
        const txnId = data.txnId;
        const orderRef = data.orderRef;
        const formattedAmount = data.formattedAmount;
        const cardType = data.cardType;
        const pan = data.pan;
        const createdAt = data.createdAt;

        if (isSuccess) {
          root.innerHTML = `
            <div class="absolute top-0 right-0 w-40 h-40 bg-emerald-500/10 rounded-full blur-3xl pointer-events-none"></div>

            <div class="check-ring bg-emerald-500/20 text-emerald-400 border-2 border-emerald-400/50 shadow-lg shadow-emerald-500/20">
              <i class="fas fa-check text-4xl"></i>
            </div>

            <div class="text-center mb-6">
              <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold text-emerald-400 status-badge-paid uppercase tracking-wider mb-2">
                <i class="fas fa-shield-check"></i> Payment Confirmed
              </span>
              <h1 class="text-3xl font-black text-white">Payment Successful!</h1>
              <p class="text-sm text-white/60 mt-1.5">Thank you for your order with Itinera. Your payment has been processed and signed in the database.</p>
            </div>

            <div class="bg-white/5 rounded-xl p-5 border border-white/10 space-y-1 mb-8">
              <div class="detail-row">
                <span class="text-white/60"><i class="fas fa-hashtag text-amber-400 mr-2"></i>Paymob Transaction ID</span>
                <span class="font-mono font-bold text-amber-400">${txnId}</span>
              </div>
              <div class="detail-row">
                <span class="text-white/60"><i class="fas fa-receipt text-amber-400 mr-2"></i>Order Reference</span>
                <span class="font-mono text-white/90">${orderRef}</span>
              </div>
              <div class="detail-row">
                <span class="text-white/60"><i class="fas fa-credit-card text-amber-400 mr-2"></i>Payment Method</span>
                <span class="font-semibold text-white/90">${cardType} (Ending ${pan})</span>
              </div>
              <div class="detail-row">
                <span class="text-white/60"><i class="fas fa-coins text-amber-400 mr-2"></i>Amount Paid</span>
                <span class="text-lg font-black text-emerald-400">${formattedAmount}</span>
              </div>
              <div class="detail-row">
                <span class="text-white/60"><i class="fas fa-clock text-amber-400 mr-2"></i>Date & Time</span>
                <span class="text-xs text-white/70">${createdAt}</span>
              </div>
            </div>

            <div class="flex flex-col sm:flex-row items-center justify-center gap-3">
              <a href="dashboard.html" class="w-full sm:w-auto px-6 py-3 rounded-xl bg-amber-400 hover:bg-amber-300 text-slate-950 font-bold text-sm transition text-center shadow-lg shadow-amber-400/20">
                <i class="fas fa-tachometer-alt mr-2"></i>Go to Dashboard
              </a>
              <a href="receipt.html?order_id=${encodeURIComponent(orderRef)}&id=${encodeURIComponent(txnId)}" class="w-full sm:w-auto px-6 py-3 rounded-xl bg-white/10 hover:bg-white/20 text-white font-semibold text-sm transition text-center border border-white/15">
                <i class="fas fa-receipt mr-2"></i>View Receipt
              </a>
              <button type="button" onclick="window.print()" class="w-full sm:w-auto px-4 py-3 rounded-xl bg-white/5 hover:bg-white/10 text-white/70 hover:text-white font-medium text-sm transition text-center border border-white/10">
                <i class="fas fa-print mr-2"></i>Print
              </button>
            </div>
          `;
        } else {
          root.innerHTML = `
            <div class="check-ring bg-rose-500/20 text-rose-400 border-2 border-rose-400/50">
              <i class="fas fa-times text-4xl"></i>
            </div>

            <div class="text-center mb-6">
              <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold text-rose-400 status-badge-failed uppercase tracking-wider mb-2">
                <i class="fas fa-exclamation-circle"></i> Payment Failed
              </span>
              <h1 class="text-3xl font-black text-white">Payment Could Not Be Processed</h1>
              <p class="text-sm text-white/60 mt-1.5">Your payment was declined or cancelled by the card issuer/gateway. No charges were captured.</p>
            </div>

            <div class="flex flex-col sm:flex-row items-center justify-center gap-3 mt-8">
              <a href="../plans.html" class="w-full sm:w-auto px-6 py-3 rounded-xl bg-amber-400 hover:bg-amber-300 text-slate-950 font-bold text-sm transition text-center">
                <i class="fas fa-rotate-right mr-2"></i>Try Again
              </a>
              <a href="dashboard.html" class="w-full sm:w-auto px-6 py-3 rounded-xl bg-white/10 hover:bg-white/20 text-white font-semibold text-sm transition text-center">
                Go to Dashboard
              </a>
            </div>
          `;
        }
      }

      // If an orderRef exists in URL parameters, fetch real database details
      if (paramOrderRef && window.Itinari && window.Itinari.apiGet) {
        window.Itinari.apiGet("/orders/lookup/" + encodeURIComponent(paramOrderRef), { auth: true })
          .then(function (res) {
            if (res.ok && res.body && res.body.data) {
              const o = res.body.data;
              const formattedAmt = new Intl.NumberFormat('en-US', { style: 'currency', currency: o.currency || 'EGP' }).format(o.total_amount || 0);
              renderCard({
                isSuccess: o.is_success,
                txnId: o.transaction_id || "N/A",
                orderRef: o.merchant_order_id || ("ORDER_" + o.order_id),
                formattedAmount: formattedAmt,
                cardType: o.card_type || "Paymob Gateway",
                pan: o.card_pan || "****",
                createdAt: o.created_at ? new Date(o.created_at).toLocaleString() : new Date().toLocaleString()
              });
            } else {
              fallbackFromParams();
            }
          })
          .catch(function () {
            fallbackFromParams();
          });
      } else {
        fallbackFromParams();
      }

      function fallbackFromParams() {
        const txnId = params.get("id") || params.get("transaction_id") || "N/A";
        const orderRef = paramOrderRef || "N/A";
        const rawAmount = params.get("amount") || params.get("amount_cents");
        const currency = params.get("currency") || "EGP";
        const pan = params.get("source_data.pan") || params.get("pan") || "****";
        const cardType = params.get("source_data.sub_type") || params.get("card_type") || "Credit / Debit Card";
        const createdAt = params.get("created_at") ? new Date(params.get("created_at")).toLocaleString() : new Date().toLocaleString();

        let formattedAmount = "—";
        if (rawAmount) {
          let num = parseFloat(rawAmount);
          if (num > 1000 && rawAmount.indexOf('.') === -1) num = num / 100;
          formattedAmount = new Intl.NumberFormat('en-US', { style: 'currency', currency: currency }).format(num);
        }

        renderCard({
          isSuccess: querySuccess,
          txnId: txnId,
          orderRef: orderRef,
          formattedAmount: formattedAmount,
          cardType: cardType,
          pan: pan,
          createdAt: createdAt
        });
      }
    });
  </script>
</body>
</html>
