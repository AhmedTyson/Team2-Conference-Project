<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <!-- Font Awesome 6 (free) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

  <!-- GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <!-- Shared styles -->
  <link rel="stylesheet" href="../assets/css/app.css" />
  <link rel="stylesheet" href="../assets/css/app.css" />
  <link rel="stylesheet" href="" />
  <link rel="stylesheet" href="" />
  <link rel="stylesheet" href="" />
  <link rel="stylesheet" href="" />

  <script>window.APP_URL = ".";</script>
  <script src="../assets/js/core/config.js"></script>
  <script src="../assets/js/core/api.js"></script>
  <script src="../assets/js/core/session.js"></script>
  <script src="../js/surveys-core.js"></script>
  <script>window.Itinera && (window.Itinera.CONFIG.publicPage = true);</script>
  <script>/* FOUC prevention — default dark */
    (function(){var k="itinera_theme",s;try{s=localStorage.getItem(k);}catch(e){}
    if(!s||s==="dark"||(s==="system"&&window.matchMedia&&window.matchMedia("(prefers-color-scheme:dark)").matches))
      document.documentElement.classList.add("dark","fouc-ready");
    else document.documentElement.classList.add("fouc-ready");
    })();
  </script></head>
<body data-layout="app">

  <div class="toast" id="toast">
  <i class="fas fa-check-circle text-green-400" aria-hidden="true"></i>
  <span id="toastMessage">Success</span>
</div>
  <div class="modal-overlay" id="authModal">
  <div class="modal-box">
    <div class="flex justify-between items-center mb-4">
      <h3 class="text-xl font-bold" id="authTitle">Welcome to Itinera</h3>
      <button type="button" class="text-white/50 hover:text-white text-xl cursor-pointer" id="authCloseBtn" title="Close modal" aria-label="Close modal">
        <i class="fas fa-times" aria-hidden="true"></i>
      </button>
    </div>
    <div class="auth-tabs flex border border-white/10 rounded-full overflow-hidden mb-4">
      <button type="button" id="tabLogin" class="on">Log in</button>
      <button type="button" id="tabRegister">Sign up</button>
    </div>

    <form id="loginForm" novalidate>
      <label for="loginEmail"><i class="fas fa-envelope mr-1" aria-hidden="true"></i>Email</label>
      <input type="email" id="loginEmail" placeholder="you@example.com" required />
      <label for="loginPassword"><i class="fas fa-lock mr-1" aria-hidden="true"></i>Password</label>
      <input type="password" id="loginPassword" placeholder="••••••••" required />
      <button type="submit" class="btn-white w-full mt-4 flex items-center justify-center gap-2">
        <i class="fas fa-arrow-right" aria-hidden="true"></i>Log in
      </button>
      <p class="text-sm mt-2 text-white/40" id="loginStatus" role="status"></p>
      <p class="text-xs text-white/30 mt-3 pt-3 border-t border-white/10">
        <i class="fas fa-info-circle mr-1" aria-hidden="true"></i>Demo: <span class="text-white/60">admin@example.com</span> / <span class="text-white/60">password</span>
      </p>
    </form>

    <form id="registerForm" style="display:none;" novalidate>
      <label for="regName"><i class="fas fa-user mr-1" aria-hidden="true"></i>Full name</label>
      <input type="text" id="regName" placeholder="Jane Doe" required />
      <label for="regEmail"><i class="fas fa-envelope mr-1" aria-hidden="true"></i>Email</label>
      <input type="email" id="regEmail" placeholder="you@example.com" required />
      <label for="regPhone"><i class="fas fa-phone mr-1" aria-hidden="true"></i>Phone</label>
      <input type="tel" id="regPhone" placeholder="+1 555 000 0000" />
      <label for="regPassword"><i class="fas fa-lock mr-1" aria-hidden="true"></i>Password</label>
      <input type="password" id="regPassword" placeholder="Min. 8 characters" required minlength="8" />
      <button type="submit" class="btn-white w-full mt-4 flex items-center justify-center gap-2">
        <i class="fas fa-user-plus" aria-hidden="true"></i>Create account
      </button>
      <p class="text-sm mt-2 text-white/40" id="registerStatus" role="status"></p>
    </form>
  </div>
</div>

    <div class="page-scroll">
    <div class="giant-text"><h1>NEW SURVEY</h1></div>
    <div class="content-layer">

      <header class="app-nav-header"></header>

      <div class="max-w-2xl mx-auto w-full mt-10">
        <div class="text-center mb-8">
          <h2 class="section-title">Create a travel survey</h2>
          <p class="section-sub mx-auto">Three quick questions — your answers tune the itineraries we suggest.</p>
        </div>

        <div class="glass-card p-8">
          <div id="surveyFormHost"></div>
          <p class="text-red-400 text-sm mt-4 hidden" id="formErr" role="alert"></p>
          <div class="flex items-center justify-between gap-3 mt-6">
            <a href="surveys.html" class="btn-outline"><i class="fas fa-arrow-left" aria-hidden="true"></i>Back</a>
            <button type="button" class="btn-primary" id="createBtn"><i class="fas fa-paper-plane" aria-hidden="true"></i>Create survey</button>
          </div>
        </div>
      </div>

      <footer class="app-footer"></footer>
    </div>
  </div>

  <!-- Shared application bootstrap (session restore, auth modal wiring, session UI) -->
  <script type="module" src="../js/app.js"></script>

  <script src="../assets/js/core/topbar.js"></script>

    <script src="../assets/js/core/footer-component.js"></script>
</body>
</html>
