<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile Settings · Travel Planner</title>
  <link rel="stylesheet" href="../assets/css/tokens.css" />
  <link rel="stylesheet" href="../assets/css/app.css" />
  <script>/* FOUC prevention — default dark */
    (function(){var k="itinari_theme",s;try{s=localStorage.getItem(k);}catch(e){}
    if(!s||s==="dark"||(s==="system"&&window.matchMedia&&window.matchMedia("(prefers-color-scheme:dark)").matches))
      document.documentElement.classList.add("dark","fouc-ready");
    else document.documentElement.classList.add("fouc-ready");
    })();
  </script>  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body data-page="profile" class="is-booting" data-layout="app">
  <div class="app">
    <!-- Top Navigation Header -->
    <header class="app-nav-header"></header>
      <div id="app-user" class="app__user">
        <button id="theme-toggle" type="button" class="btn btn--ghost" aria-label="Toggle theme">◐</button>
      </div>
    </header>

    <main class="app__main">
      <div class="page">
        <header class="page-header" style="display:flex;justify-content:space-between;align-items:flex-end;gap:var(--space-4);">
          <div>
            <p class="page-header__eyebrow">Account</p>
            <h1 class="page-header__title">Profile settings</h1>
            <p class="page-header__lead" id="settings-lead">Manage your avatar, name, email and password.</p>
          </div>
          <a href="/profile.html" class="btn btn--ghost">Back to profile</a>
        </header>

        <form class="form" id="profile-form" novalidate>
          <div class="form__card">
            <div class="profile-head">
              <div id="avatar-preview" class="profile-avatar-wrap"></div>
              <div>
                <button type="button" id="change-photo" class="btn btn--ghost">Change photo</button>
                <input id="avatar-input" type="file" accept="image/*" hidden />
                <p class="field__error" id="avatar-error" hidden></p>
              </div>
            </div>

            <div class="field">
              <label class="field__label" for="set-name">Full Name</label>
              <input id="set-name" class="input" type="text" maxlength="255" autocomplete="name" />
              <p class="field__error" id="name-error" hidden></p>
            </div>

            <div class="field">
              <label class="field__label" for="set-email">Email Address</label>
              <input id="set-email" class="input" type="email" maxlength="255" autocomplete="email" />
              <p class="field__error" id="email-error" hidden></p>
            </div>

            <div class="field">
              <label class="field__label" for="set-phone">Phone Number</label>
              <input id="set-phone" class="input" type="tel" maxlength="25" placeholder="+20 100 123 4567" autocomplete="tel" />
              <p class="field__error" id="phone-error" hidden></p>
            </div>

            <div class="field">
              <label class="field__label" for="set-country">Country / Region</label>
              <input id="set-country" class="input" type="text" maxlength="100" placeholder="Egypt" autocomplete="country-name" />
            </div>

            <div class="field">
              <label class="field__label" for="set-currency">Preferred Currency</label>
              <select id="set-currency" class="input">
                <option value="USD">USD ($)</option>
                <option value="EUR">EUR (€)</option>
                <option value="GBP">GBP (£)</option>
                <option value="EGP">EGP (E£)</option>
                <option value="AED">AED (AED)</option>
              </select>
            </div>

            <div class="field">
              <label class="field__label" for="set-emergency">Emergency Contact</label>
              <input id="set-emergency" class="input" type="text" maxlength="255" placeholder="Name & Phone Number" />
            </div>

            <div class="field">
              <label class="field__label" for="set-bio">Personal Bio & Travel Preferences</label>
              <textarea id="set-bio" class="input" rows="3" maxlength="1000" placeholder="Share your travel interests, dietary preferences, or travel style..."></textarea>
            </div>

            <div class="form__divider"><span class="form__divider-label">Change password — optional</span></div>

            <div class="field">
              <label class="field__label" for="set-password">New password</label>
              <input id="set-password" class="input" type="password" autocomplete="new-password" placeholder="Leave blank to keep current" />
              <p class="field__error" id="password-error" hidden></p>
            </div>

            <div class="field">
              <label class="field__label" for="set-password-confirm">Confirm password</label>
              <input id="set-password-confirm" class="input" type="password" autocomplete="new-password" />
              <p class="field__error" id="password-confirm-error" hidden></p>
            </div>

            <div class="btn-row">
              <button type="submit" class="btn btn--primary">Save profile</button>
            </div>
          </div>
        </form>
      </div>
    </main>

    <footer class="app__footer">
      <span>Travel Planner</span>
      <span>•</span>
      <span>Plan. Explore. Remember.</span>
    </footer>
  </div>

  <script src="../assets/js/core/config.js"></script>
  <script src="../assets/js/core/api.js"></script>
  <script src="../assets/js/core/session.js"></script>
  <script src="../assets/js/core/nav-config.js"></script>
  <script src="../assets/js/core/app-shell.js"></script>
  <script src="../assets/js/profile-settings.js"></script>
    <script src="../assets/js/core/navbar-component.js"></script>
</body>
</html>
