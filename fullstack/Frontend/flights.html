<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flights — Itinera</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script>(function(){try{if(localStorage.getItem('itinari_theme')==='dark')document.documentElement.classList.add('dark');}catch(e){}})();</script>
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/app.css">
  <script>/* FOUC prevention — default dark */
    (function(){var k="itinari_theme",s;try{s=localStorage.getItem(k);}catch(e){}
    if(!s||s==="dark"||(s==="system"&&window.matchMedia&&window.matchMedia("(prefers-color-scheme:dark)").matches))
      document.documentElement.classList.add("dark","fouc-ready");
    else document.documentElement.classList.add("fouc-ready");
    })();
  </script></head>
<body data-page="flights" class="is-booting" data-layout="public">
  <div class="app">
      <!-- Top Navigation Header -->
  <header class="app-nav-header">
    <div class="app-nav-container">
      <a href="index.html" class="app-brand">
        <span class="brand-mark">IT</span>
        <span class="brand-name">Itinera</span>
      </a>
      <nav class="app-nav-links" aria-label="Public Navigation">
        <a href="index.html" class="app-nav-link"><i class="fas fa-home"></i> <span>Home</span></a>
        <a href="explore.html" class="app-nav-link"><i class="fas fa-compass"></i> <span>Explore</span></a>
        <a href="weather.html" class="app-nav-link"><i class="fas fa-cloud-sun"></i> <span>Weather</span></a>
        <a href="plans.html" class="app-nav-link"><i class="fas fa-crown"></i> <span>Plans</span></a>
        <a href="about.html" class="app-nav-link"><i class="fas fa-info-circle"></i> <span>About</span></a>
        <a href="contact.html" class="app-nav-link"><i class="fas fa-envelope"></i> <span>Contact</span></a>
        <a href="help.html" class="app-nav-link"><i class="fas fa-circle-question"></i> <span>Help</span></a>
      </nav>
      <div class="topbar-right" id="navAuthContainer">
        <button type="button" id="theme-toggle" class="icon-btn theme-toggle" aria-label="Toggle theme">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/><line x1="4.9" y1="4.9" x2="6.3" y2="6.3"/><line x1="17.7" y1="17.7" x2="19.1" y2="19.1"/><line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/><line x1="4.9" y1="19.1" x2="6.3" y2="17.7"/><line x1="17.7" y1="6.3" x2="19.1" y2="4.9"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        </button>
        <a href="auth/login.html" class="guest-actions">
          <span>Sign in</span>
          <i class="fas fa-arrow-right text-xs"></i>
        </a>
      </div>
    </div>
  </header>

    <main class="app__main">
      <div class="page">
        <header class="page-header" style="margin-bottom: var(--space-8);">
          <p class="page-header__eyebrow">Airlines & Routes</p>
          <h1 class="page-header__title">Flights Catalog</h1>
          <p class="page-header__lead">Browse all available flights and connections across the globe.</p>
        </header>

        <div class="toolbar" style="display:flex; justify-content:space-between; align-items:center; margin-bottom: var(--space-6);">
          <label style="display:flex; align-items:center; gap:var(--space-2); background:var(--surface-2); padding:var(--space-2) var(--space-3); border-radius:var(--radius-full);">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px;"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="search" id="searchInput" placeholder="Search flights..." style="background:transparent; border:none; outline:none; font-family:inherit; font-size:var(--fs-sm); color:var(--text);" autocomplete="off">
          </label>
        </div>

        <div id="results" style="display:grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: var(--space-4);">
          <!-- Skeletons -->
          <div class="skeleton skeleton--card"></div>
          <div class="skeleton skeleton--card"></div>
          <div class="skeleton skeleton--card"></div>
        </div>
      </div>
    </main>

    <footer class="app__footer"></footer>
  </div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/session.js"></script>
  <script src="assets/js/nav-config.js"></script>
  <script src="assets/js/app-shell.js"></script>
  <script src="assets/js/flights.js"></script>
  <script src="./assets/js/core/theme.js"></script>
  <script src="assets/js/core/topbar.js"></script>
</body>
</html>
