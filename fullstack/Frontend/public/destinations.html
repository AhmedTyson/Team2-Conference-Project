<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Destinations — Itinera</title>
  <meta name="description" content="Explore curated destinations with the Itinera travel planner.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>(function(){try{if(localStorage.getItem('itinera_theme')==='dark')document.documentElement.classList.add('dark');}catch(e){}})();</script>
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/pages.css">
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/app.css">
  <script>/* FOUC prevention — default dark */
    (function(){var k="itinera_theme",s;try{s=localStorage.getItem(k);}catch(e){}
    if(!s||s==="dark"||(s==="system"&&window.matchMedia&&window.matchMedia("(prefers-color-scheme:dark)").matches))
      document.documentElement.classList.add("dark","fouc-ready");
    else document.documentElement.classList.add("fouc-ready");
    })();
  </script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body data-page="destinations" class="is-booting" data-layout="public">
  <div class="app">
      <!-- Top Navigation Header -->
  <header class="app-nav-header"></header>

    <main class="app__main">

  <main id="main">
    <section class="page-hero">
      <div class="container">
        <p class="eyebrow"><span class="knum">01</span> / EXPLORE</p>
        <h1>Destinations</h1>
        <p class="hero-sub">Places that stay with you — chosen for atmosphere, story and the right light.</p>
      </div>
    </section>

    <section class="section" aria-label="Itinera at a glance">
      <div class="container">
        <div class="intro-strip">
          <div class="intro-stat"><div class="n" id="statDestinations">—</div><div class="l">Destinations</div></div>
          <div class="intro-stat"><div class="n" id="statHotels">—</div><div class="l">Hotels</div></div>
          <div class="intro-stat"><div class="n" id="statRestaurants">—</div><div class="l">Restaurants</div></div>
          <div class="intro-stat"><div class="n" id="statAttractions">—</div><div class="l">Attractions</div></div>
        </div>
      </div>
    </section>

    <section class="section" aria-label="All destinations">
      <div class="container">
        <div class="toolbar" role="search" aria-label="Filter destinations">
          <label class="search-box">
            <span class="search-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            </span>
            <input type="search" class="search-input" id="searchInput" placeholder="Search destinations…" autocomplete="off">
          </label>
          <div class="chip-group" id="countryChips" aria-label="Filter by country"></div>
          <div class="toolbar-row">
            <span class="result-count" id="resultCount" aria-live="polite">—</span>
            <label class="search-box" style="flex:0 0 auto" aria-label="Sort destinations">
              <select class="select" id="sortSelect">
                <option value="name">Name A–Z</option>
                <option value="city">City A–Z</option>
              </select>
            </label>
          </div>
        </div>
        <div class="grid" id="results"></div>
        <div class="state-host" id="stateHost" aria-live="polite"></div>
      </div>
    </section>
  </main>

    </main>

    <footer class="app__footer"></footer>
  </div>

  <div class="toast-host" id="toastHost" aria-live="assertive"></div>
  <div class="modal" id="modalHost" hidden></div>

  <script src="../assets/js/core/config.js"></script>
  <script src="../assets/js/core/api.js"></script>
  <script src="../assets/js/core/session.js"></script>
      
  
  
  <script src="../assets/js/components/ui.js"></script>
  <script src="../assets/js/pages/destinations.js"></script>
    <script src="../assets/js/core/theme.js"></script>
  <script src="../assets/js/core/navbar-component.js"></script>
  <script src="../assets/js/core/topbar.js"></script>
</body>
</html>
