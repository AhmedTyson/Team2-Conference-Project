<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Community Trip Preview · Itinera</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet" />

  <!-- Font Awesome 6 Free -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- Leaflet Maps CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- Shared Custom Styling -->
  <link rel="stylesheet" href="../assets/css/public.css" />
  
  <style>
    :root {
      --comm-bg: #f3f1ea;
      --comm-panel: #ffffff;
      --comm-border: #eae6da;
      --comm-text: #17181a;
      --comm-shadow: 0 10px 30px rgba(23, 24, 26, 0.06);
    }

    html.dark {
      --comm-bg: #0a0a0a;
      --comm-panel: #121212;
      --comm-border: rgba(255, 255, 255, 0.1);
      --comm-text: #ffffff;
      --comm-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
    }

    body {
      background-color: var(--comm-bg);
      color: var(--comm-text);
      font-family: 'Inter', sans-serif;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .preview-card {
      background: var(--comm-panel);
      border: 1px solid var(--comm-border);
      border-radius: 1.5rem;
      box-shadow: var(--comm-shadow);
    }

    #trip-preview-map {
      height: 340px;
      width: 100%;
      border-radius: 1.25rem;
      z-index: 10;
    }

    #sticky-fork-bar {
      position: fixed !important;
      bottom: 24px !important;
      left: 50% !important;
      transform: translateX(-50%) !important;
      height: auto !important;
      max-height: 72px !important;
      min-height: 60px !important;
      top: auto !important;
      z-index: 9999 !important;
      box-sizing: border-box !important;
      margin: 0 !important;
    }
  </style>

  <script>
    (function(){
      var k="itinera_theme",s;try{s=localStorage.getItem(k);}catch(e){}
      if(!s||s==="dark"||(s==="system"&&window.matchMedia&&window.matchMedia("(prefers-color-scheme:dark)").matches))
        document.documentElement.classList.add("dark","fouc-ready");
      else document.documentElement.classList.add("fouc-ready");
    })();
  </script>
</head>
<body class="min-h-screen flex flex-col font-['Inter']" data-layout="public">
  <div class="app-wrapper flex-1 flex flex-col">
    
    <!-- Global Dynamic Top Navbar -->
    <header class="app-nav-header"></header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 py-8 w-full flex-1 space-y-8 mb-20">
      
      <!-- Top Breadcrumbs & Back Navigation -->
      <div class="flex items-center justify-between gap-4 flex-wrap">
        <a href="community.html" class="inline-flex items-center gap-2 text-xs font-bold text-gray-500 dark:text-white/60 hover:text-amber-500 transition">
          <i class="fas fa-arrow-left text-[10px]"></i> Back to Community Feed
        </a>
        <div class="flex items-center gap-2 text-xs font-semibold text-gray-400">
          <span>Community</span>
          <i class="fas fa-chevron-right text-[9px]"></i>
          <span class="text-amber-500 font-bold" id="breadcrumb-title">Itinerary Preview</span>
        </div>
      </div>

      <!-- Main Preview Shell -->
      <div id="preview-shell" class="space-y-8">
        <!-- Skeleton Loading State -->
        <div class="p-8 rounded-3xl bg-white dark:bg-white/5 border border-gray-200 dark:border-white/10 animate-pulse space-y-6">
          <div class="h-64 bg-gray-200 dark:bg-white/10 rounded-2xl"></div>
          <div class="h-8 bg-gray-200 dark:bg-white/10 rounded w-1/3"></div>
          <div class="h-4 bg-gray-200 dark:bg-white/10 rounded w-2/3"></div>
        </div>
      </div>

    </main>

    <!-- Fresh Guaranteed Inline Floating Capsule -->
    <div id="community-fork-dock" style="position: fixed !important; bottom: 24px !important; left: 50% !important; transform: translateX(-50%) !important; z-index: 99999 !important; width: 90% !important; max-width: 520px !important; height: 64px !important; min-height: 64px !important; max-height: 64px !important; background: #0a0a0a !important; border: 1px solid rgba(245, 158, 11, 0.4) !important; border-radius: 9999px !important; box-shadow: 0 20px 40px rgba(0,0,0,0.7) !important; display: flex !important; align-items: center !important; justify-content: space-between !important; padding: 0 16px 0 20px !important; color: #ffffff !important; margin: 0 !important; top: auto !important; right: auto !important;">
      <div style="display: flex !important; align-items: center !important; gap: 12px !important; min-width: 0 !important;">
        <div style="width: 36px !important; height: 36px !important; border-radius: 50% !important; background: rgba(245, 158, 11, 0.15) !important; color: #f59e0b !important; display: flex !important; align-items: center !important; justify-content: center !important; font-size: 14px !important; flex-shrink: 0 !important; border: 1px solid rgba(245, 158, 11, 0.3) !important;">
          <i class="fas fa-compass"></i>
        </div>
        <div style="min-width: 0 !important; display: flex !important; flex-direction: column !important;">
          <span style="font-size: 9px !important; font-weight: 900 !important; letter-spacing: 1px !important; text-transform: uppercase !important; color: #f59e0b !important; line-height: 1.2 !important; margin-bottom: 2px !important;">Ready to Customize?</span>
          <strong id="sticky-trip-title" style="font-size: 13px !important; font-weight: 800 !important; color: #ffffff !important; white-space: nowrap !important; overflow: hidden !important; text-overflow: ellipsis !important; max-width: 220px !important; line-height: 1.2 !important;">Fork this itinerary into your planner</strong>
        </div>
      </div>
      <button type="button" id="sticky-fork-btn" style="padding: 10px 22px !important; border-radius: 9999px !important; background: #f59e0b !important; color: #000000 !important; font-size: 12px !important; font-weight: 900 !important; border: none !important; cursor: pointer !important; display: flex !important; align-items: center !important; gap: 8px !important; flex-shrink: 0 !important; box-shadow: 0 4px 14px rgba(245, 158, 11, 0.4) !important;">
        <i class="fas fa-code-branch"></i>
        <span>Fork Itinerary</span>
      </button>
    </div>

    <!-- Footer -->
    <footer class="app-footer"></footer>

  </div>

  <!-- Scripts -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/nav-config.js"></script>
  <script src="../assets/js/core/navbar-component.js"></script>
  <script src="../assets/js/trip-preview.js"></script>
  <script src="../assets/js/core/footer-component.js"></script>
</body>
</html>
