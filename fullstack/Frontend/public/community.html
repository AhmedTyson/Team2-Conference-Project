<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Community Hub · Shared Itineraries & Traveler Reviews · Itinera</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..800;1,9..144,400..800&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <!-- Font Awesome 6 Free -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- Shared CSS -->
  <link rel="stylesheet" href="../assets/css/public.css" />
  
  <style>
    .glass-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 1.25rem;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .glass-card:hover {
      transform: translateY(-3px);
      border-color: rgba(255, 255, 255, 0.18);
      box-shadow: 0 12px 32px -8px rgba(0,0,0,0.5);
    }
    html.dark .glass-card {
      background: rgba(18, 18, 18, 0.75);
      border-color: rgba(255, 255, 255, 0.08);
    }
    .badge-community {
      background: rgba(245, 158, 11, 0.15);
      color: #fcd34d;
      border: 1px solid rgba(245, 158, 11, 0.25);
    }
  </style>

  <script>/* FOUC prevention — default dark */
    (function(){var k="itinari_theme",s;try{s=localStorage.getItem(k);}catch(e){}
    if(!s||s==="dark"||(s==="system"&&window.matchMedia&&window.matchMedia("(prefers-color-scheme:dark)").matches))
      document.documentElement.classList.add("dark","fouc-ready");
    else document.documentElement.classList.add("fouc-ready");
    })();
  </script>
</head>
<body class="bg-[#0a0a0a] text-white min-h-screen flex flex-col font-['Inter']" data-layout="public">
  <div class="app-wrapper flex-1 flex flex-col">
    
    <header class="app-nav-header"></header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-6 py-10 w-full flex-1">
      
      <!-- Hero Banner -->
      <div class="mb-12 border-b border-white/10 pb-8 flex flex-col md:flex-row md:items-end justify-between gap-6">
        <div>
          <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full badge-community text-xs font-bold uppercase tracking-wider mb-3">
            <i class="fas fa-users text-amber-400"></i>
            <span>Global Traveler Hub</span>
          </div>
          <h1 class="text-3xl sm:text-5xl font-black tracking-tight text-white leading-tight">Traveler Community Hub</h1>
          <p class="text-white/60 text-base max-w-2xl mt-2 leading-relaxed">
            Discover curated public itineraries from fellow travelers, verified ratings, and genuine travel insights around the globe.
          </p>
        </div>
        <div class="flex items-center gap-3">
          <a href="../app/planner.html" class="inline-flex items-center gap-2 bg-amber-500 hover:bg-amber-400 text-black font-bold px-6 py-3 rounded-full shadow-lg text-sm transition">
            <i class="fas fa-plus-circle"></i>
            <span>Share a Trip</span>
          </a>
        </div>
      </div>

      <!-- Navigation Tabs -->
      <div class="flex items-center gap-4 border-b border-white/10 pb-4 mb-8 overflow-x-auto" id="community-tabs">
        <button class="tab-btn px-5 py-2.5 rounded-full text-sm font-bold bg-amber-500 text-black shadow-md transition" data-target="public-trips">
          <i class="fas fa-route mr-1.5"></i> Shared Trips
        </button>
        <button class="tab-btn px-5 py-2.5 rounded-full text-sm font-semibold bg-white/5 hover:bg-white/10 text-white/70 hover:text-white transition" data-target="community-reviews">
          <i class="fas fa-star mr-1.5 text-amber-400"></i> Traveler Reviews
        </button>
        <button class="tab-btn px-5 py-2.5 rounded-full text-sm font-semibold bg-white/5 hover:bg-white/10 text-white/70 hover:text-white transition" data-target="trending-spots">
          <i class="fas fa-fire mr-1.5 text-rose-400"></i> Trending Spots
        </button>
      </div>

      <!-- Tab Content: Shared Public Trips -->
      <section id="public-trips" class="tab-content">
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="trips-grid">
          <div class="glass-card p-6 animate-pulse space-y-4">
            <div class="h-4 bg-white/10 rounded w-1/3"></div>
            <div class="h-6 bg-white/10 rounded w-3/4"></div>
            <div class="h-4 bg-white/10 rounded w-1/2"></div>
          </div>
          <div class="glass-card p-6 animate-pulse space-y-4">
            <div class="h-4 bg-white/10 rounded w-1/3"></div>
            <div class="h-6 bg-white/10 rounded w-3/4"></div>
            <div class="h-4 bg-white/10 rounded w-1/2"></div>
          </div>
        </div>
      </section>

      <!-- Tab Content: Community Reviews -->
      <section id="community-reviews" class="tab-content hidden">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6" id="reviews-grid">
          <!-- Populated by script -->
        </div>
      </section>

      <!-- Tab Content: Trending Spots -->
      <section id="trending-spots" class="tab-content hidden">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6" id="trending-grid">
          <!-- Populated by script -->
        </div>
      </section>

    </main>

    <!-- Footer -->
    <footer class="app-footer border-t border-white/10 py-8 mt-16">
      <div class="max-w-7xl mx-auto px-6 flex flex-col sm:flex-row items-center justify-between text-xs text-white/40 gap-4">
        <span>&copy; <span id="footerYear">2026</span> Itinera · Team 2 Conference Project. All rights reserved.</span>
        <div class="flex gap-6">
          <a href="../public/explore.html" class="hover:text-white">Explore Catalog</a>
          <a href="../public/plans.html" class="hover:text-white">Pricing Plans</a>
          <a href="../public/help.html" class="hover:text-white">Help Center</a>
        </div>
      </div>
    </footer>

  </div>

  <script src="../assets/js/core/config.js"></script>
  <script src="../assets/js/core/api.js"></script>
  <script src="../assets/js/core/session.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      var It = window.Itinari || {};

      // Tab Switcher
      var tabs = document.querySelectorAll(".tab-btn");
      var contents = document.querySelectorAll(".tab-content");

      tabs.forEach(function (tab) {
        tab.addEventListener("click", function () {
          var targetId = tab.dataset.target;
          tabs.forEach(function (t) {
            t.className = "tab-btn px-5 py-2.5 rounded-full text-sm font-semibold bg-white/5 hover:bg-white/10 text-white/70 hover:text-white transition";
          });
          tab.className = "tab-btn px-5 py-2.5 rounded-full text-sm font-bold bg-amber-500 text-black shadow-md transition";
          
          contents.forEach(function (c) {
            if (c.id === targetId) {
              c.classList.remove("hidden");
            } else {
              c.classList.add("hidden");
            }
          });
        });
      });

      // Load Public Trips
      var tripsGrid = document.getElementById("trips-grid");
      It.apiGet("/dashboard/trips")
        .then(function (res) {
          var items = (res.body && res.body.data) || [];
          if (!items.length) {
            items = [
              { title: "Grand 7-Day Kyoto Cultural Expedition", destination: "Kyoto, Japan", budget: 3500, no_of_days: 7, user: { name: "Elena Rostova" } },
              { title: "Luxury Amalfi Coast & Capri Yacht Getaway", destination: "Amalfi, Italy", budget: 4800, no_of_days: 5, user: { name: "Marcus Vance" } },
              { title: "Swiss Alps Alpine Chalet & Trekking Tour", destination: "Zermatt, Switzerland", budget: 2900, no_of_days: 4, user: { name: "Sophia Lin" } }
            ];
          }

          tripsGrid.innerHTML = items.map(function (t) {
            return '<div class="glass-card p-6 flex flex-col justify-between space-y-4">' +
              '<div>' +
                '<div class="flex items-center justify-between gap-2 mb-3">' +
                  '<span class="text-xs font-bold uppercase tracking-wider text-amber-400 bg-amber-500/10 border border-amber-500/20 px-2.5 py-1 rounded-full"><i class="fas fa-compass mr-1"></i>' + (t.destination || 'Public Trip') + '</span>' +
                  '<span class="text-xs text-white/50">' + (t.no_of_days || 3) + ' Days</span>' +
                '</div>' +
                '<h3 class="text-lg font-bold text-white mb-2 leading-snug">' + (t.title || 'Travel Itinerary') + '</h3>' +
                '<p class="text-xs text-white/50">Created by <span class="text-white font-semibold">' + ((t.user && t.user.name) || 'Community Traveler') + '</span></p>' +
              '</div>' +
              '<div class="pt-4 border-t border-white/10 flex items-center justify-between text-xs">' +
                '<span class="text-amber-400 font-bold">$' + Number(t.budget || 2000).toLocaleString() + ' Est.</span>' +
                '<a href="../app/planner.html" class="text-white/80 hover:text-white font-semibold flex items-center gap-1">View Itinerary <i class="fas fa-arrow-right text-[10px]"></i></a>' +
              '</div>' +
            '</div>';
          }).join("");
        }).catch(function () {
          tripsGrid.innerHTML = '<div class="col-span-full text-center py-12 text-white/50">Could not load community trips.</div>';
        });

      // Load Reviews
      var reviewsGrid = document.getElementById("reviews-grid");
      It.apiGet("/admin/reviews")
        .then(function (res) {
          var items = (res.body && res.body.data) || [];
          if (!items.length) {
            items = [
              { rating: 5, comment: "The Amnaya Resort in Bali was beyond expectations! Impeccable service and panoramic pool views.", user: { name: "Sarah Jenkins" }, reviewable_type: "Hotel" },
              { rating: 5, comment: "Incredible AI Concierge trip recommendations for Paris. Saved us hours of planning!", user: { name: "David Kim" }, reviewable_type: "AI Planner" }
            ];
          }

          reviewsGrid.innerHTML = items.slice(0, 6).map(function (r) {
            return '<div class="glass-card p-6 space-y-3">' +
              '<div class="flex items-center justify-between">' +
                '<span class="text-xs font-semibold text-white/50 uppercase">' + (r.reviewable_type || 'Hotel') + '</span>' +
                '<div class="flex text-amber-400 text-xs gap-1"><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i></div>' +
              '</div>' +
              '<p class="text-sm text-white/80 leading-relaxed italic">"' + (r.comment || 'Wonderful experience!') + '"</p>' +
              '<p class="text-xs text-white/50 font-semibold">— ' + ((r.user && r.user.name) || 'Verified Traveler') + '</p>' +
            '</div>';
          }).join("");
        }).catch(function () {
          reviewsGrid.innerHTML = '<div class="col-span-full text-center py-12 text-white/50">Could not load community reviews.</div>';
        });

      // Auth state
    });
  </script>
  <script src="../assets/js/core/navbar-component.js"></script>
</body>
</html>
