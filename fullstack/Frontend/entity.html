<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Experience Details · Itinera</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <!-- Font Awesome 6 Free -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- Custom Luxury Stylesheet -->
  <link rel="stylesheet" href="assets/css/public.css" />
  <script>/* FOUC prevention — default dark */
    (function(){var k="itinari_theme",s;try{s=localStorage.getItem(k);}catch(e){}
    if(!s||s==="dark"||(s==="system"&&window.matchMedia&&window.matchMedia("(prefers-color-scheme:dark)").matches))
      document.documentElement.classList.add("dark","fouc-ready");
    else document.documentElement.classList.add("fouc-ready");
    })();
  </script></head>
<body class="bg-[#0d0d0c] text-white" data-layout="public">

  <!-- Toast -->
  <div class="toast" id="appToast" role="status">
    <i class="fas fa-circle-info text-amber-400"></i>
    <span id="appToastMsg">Notification</span>
  </div>

  <div class="app-wrapper">

    <!-- Top Navigation Bar -->
    <header class="max-w-7xl mx-auto px-6 py-6 flex flex-col lg:flex-row justify-between items-center gap-4">
      <div class="flex items-center gap-4">
        <a href="index.html" class="flex items-center gap-2.5 text-xl font-bold tracking-tight text-white group">
          <span class="w-8 h-8 rounded-full bg-white text-black flex items-center justify-center font-black text-sm group-hover:scale-105 transition">IT</span>
          <span>Itinera</span>
        </a>
      </div>

      <div class="nav-pill flex items-center gap-1">
        <a href="index.html" class="nav-link">
          <i class="fas fa-house"></i>
          <span class="nav-text">Home</span>
        </a>
        <a href="explore.html" class="nav-link active">
          <i class="fas fa-compass"></i>
          <span class="nav-text">Explore</span>
        </a>
        <a href="weather.html" class="nav-link">
          <i class="fas fa-cloud-sun"></i>
          <span class="nav-text">Weather</span>
        </a>
        <a href="plans.html" class="nav-link">
          <i class="fas fa-crown"></i>
          <span class="nav-text">Plans</span>
        </a>
        <a href="about.html" class="nav-link">
          <i class="fas fa-circle-info"></i>
          <span class="nav-text">About</span>
        </a>
        <a href="contact.html" class="nav-link">
          <i class="fas fa-envelope"></i>
          <span class="nav-text">Contact</span>
        </a>
        <a href="help.html" class="nav-link">
          <i class="fas fa-circle-question"></i>
          <span class="nav-text">Help</span>
        </a>
      </div>

      <div id="navAuthContainer" class="flex items-center gap-2">
        <a href="login.html" class="guest-actions">
          <span>Sign in</span>
          <i class="fas fa-arrow-right text-xs"></i>
        </a>
      </div>
    </header>

    <!-- Main Detail Section -->
    <main class="max-w-7xl mx-auto px-6 py-8" id="entity-page">
      <div class="py-20 text-center text-white/50">
        <i class="fas fa-circle-notch fa-spin text-2xl mb-3"></i>
        <p>Loading experience details...</p>
      </div>
    </main>

    <!-- Footer -->
    <footer class="app-footer mt-24">
      <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between text-xs text-white/40 gap-4">
        <span>&copy; <span id="footerYear"></span> Itinera · Team 2 Conference Project. All rights reserved.</span>
        <div class="flex gap-6">
          <a href="explore.html">Catalog</a>
          <a href="contact.html">Contact</a>
          <a href="help.html">Help</a>
        </div>
      </div>
    </footer>

  </div>

  <!-- Scripts -->
  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/session.js"></script>
  <script src="assets/js/nav-config.js"></script>
  <script src="assets/js/entity.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      var y = document.getElementById("footerYear");
      if (y) y.textContent = new Date().getFullYear();

      Itinari.session.bootAuth().then(function (auth) {
        var c = document.getElementById("navAuthContainer");
        if (!c) return;
        if (auth && auth.user) {
          var name = auth.user.name || auth.user.email || "Traveler";
          c.innerHTML = '<a href="/app/dashboard.html" class="user-profile-chip"><span class="w-5 h-5 rounded-full bg-white text-black font-bold flex items-center justify-center text-xs">' + name.charAt(0).toUpperCase() + '</span><span>' + name + '</span></a>';
        }
      });
    });
  </script>
  <script src="./assets/js/core/topbar.js"></script>
  <script src="./assets/js/core/theme.js"></script>
</body>
</html>
