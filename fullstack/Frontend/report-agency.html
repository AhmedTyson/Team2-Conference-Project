<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Report Agency · Travel Planner</title>
  <link rel="stylesheet" href="assets/css/tokens.css" />
  <link rel="stylesheet" href="assets/css/app.css" />
</head>
<body data-page="report-agency" class="is-booting">
  <div class="app">
    <header class="app__header">
      <a id="app-brand" class="app__brand" href="/home.html"></a>
      <nav id="app-nav" class="nav" aria-label="Main navigation"></nav>
      <div id="app-user" class="app__user">
        <button id="theme-toggle" type="button" class="btn btn--ghost" aria-label="Toggle theme">◐</button>
      </div>
    </header>

    <main class="app__main">
      <div class="page container" style="max-width: 600px; margin-top: var(--sp-10);">
        <header class="page-header" style="text-align: center;">
          <p class="page-header__eyebrow">Customer Support</p>
          <h1 class="page-header__title">Report an Issue</h1>
          <p class="page-header__lead">If you had a poor experience with your assigned agency, please file a report below.</p>
        </header>

        <form id="report-form" class="card" style="padding: var(--sp-6);">
          <div class="form-group" style="margin-bottom: var(--sp-4);">
            <label for="assignment_id" style="display: block; margin-bottom: var(--sp-2); font-weight: 500;">Assignment ID / Booking Reference</label>
            <input type="text" id="assignment_id" name="assignment_id" class="form-control" style="width: 100%; padding: var(--sp-3); border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface);" required placeholder="e.g. 12345">
          </div>
          <div class="form-group" style="margin-bottom: var(--sp-6);">
            <label for="reason" style="display: block; margin-bottom: var(--sp-2); font-weight: 500;">Reason for Report</label>
            <textarea id="reason" name="reason" class="form-control" style="width: 100%; padding: var(--sp-3); border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); min-height: 120px;" required placeholder="Please describe the issue in detail..."></textarea>
          </div>
          <button type="submit" id="submit-btn" class="btn btn--primary" style="width: 100%;">Submit Report</button>
        </form>
      </div>
    </main>

    <footer class="app__footer">
      <span>Travel Planner</span>
      <span>•</span>
      <span>Plan. Explore. Remember.</span>
    </footer>
  </div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/session.js"></script>
  <script src="assets/js/nav-config.js"></script>
  <script src="assets/js/app-shell.js"></script>
  <script src="assets/js/report-agency.js"></script>
</body>
</html>
