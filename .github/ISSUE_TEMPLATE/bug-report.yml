name: Bug Report
description: Report a bug or regression in the API or Architecture.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "### 🐛 Bug Report"
  - type: textarea
    id: description
    attributes:
      label: Description of the Bug
      description: What is happening?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can the QA team reproduce this error?
      value: |
        1. Call endpoint '...'
        2. With payload '...'
        3. See error '...'
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen instead?
    validations:
      required: true
