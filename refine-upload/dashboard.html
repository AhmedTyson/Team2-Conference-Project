<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard · Itinari</title>
  <!-- inlined: assets/css/dashboard.css -->
<style>
@import "auth.css";

/* ---------- layout ---------- */
.topbar {
  border-bottom: 1px solid hsl(var(--border));
  background: hsl(var(--card));
}
.topbar-inner {
  max-width: 1080px;
  margin: 0 auto;
  padding: 0.9rem 1.25rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.brand { font-weight: 800; letter-spacing: -0.02em; color: hsl(var(--primary)); }
.topbar-right { display: flex; align-items: center; gap: var(--space-4); }

.chip {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  padding: 0.3rem 0.7rem;
  border-radius: var(--radius-full);
  background: hsl(var(--accent));
  font-size: 0.82rem;
  font-weight: 600;
}
.chip[hidden] { display: none; }
.chip-role {
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  padding: 0.1rem 0.45rem;
  border-radius: var(--radius-full);
  background: hsl(var(--primary));
  color: hsl(var(--primary-foreground));
}

.btn-ghost {
  padding: 0.4rem 0.8rem;
  font-size: 0.85rem;
  font-weight: 600;
  font-family: inherit;
  color: hsl(var(--muted-foreground));
  background: transparent;
  border: 1px solid hsl(var(--border));
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: color 0.15s ease, border-color 0.15s ease;
}
.btn-ghost:hover { color: hsl(var(--foreground)); border-color: hsl(var(--input)); }

.wrap {
  max-width: 1080px;
  margin: 0 auto;
  padding: 2rem 1.25rem 4rem;
}

.greet h1 { margin: 0 0 0.25rem; font-size: 1.75rem; letter-spacing: -0.02em; }
.greet .sub { margin: 0 0 1.75rem; color: hsl(var(--muted-foreground)); font-size: 0.95rem; }

/* ---------- stats ---------- */
.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: var(--space-3);
  margin-bottom: 1.75rem;
}
.stat-card {
  display: flex;
  flex-direction: column;
  gap: 0.25rem;
  padding: 1rem 1.1rem;
  background: hsl(var(--card));
  border: 1px solid hsl(var(--border));
  border-radius: var(--radius-lg);
}
.stat-label { font-size: 0.75rem; color: hsl(var(--muted-foreground)); }
.stat-value { font-size: 1.6rem; font-weight: 800; letter-spacing: -0.02em; }

/* ---------- columns ---------- */
.columns {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--space-5);
}
@media (max-width: 760px) { .columns { grid-template-columns: 1fr; } }

.panel {
  background: hsl(var(--card));
  border: 1px solid hsl(var(--border));
  border-radius: var(--radius-lg);
  padding: 1.25rem;
}
.panel h2 { margin: 0 0 1rem; font-size: 1.05rem; letter-spacing: -0.01em; }

.feed { display: flex; flex-direction: column; gap: 0.6rem; }

.feed-item {
  padding: 0.85rem 1rem;
  border: 1px solid hsl(var(--border));
  border-radius: var(--radius-lg);
  background: hsl(var(--background));
}
.feed-item h3 { margin: 0 0 0.2rem; font-size: 0.95rem; }
.feed-item p { margin: 0; font-size: 0.82rem; color: hsl(var(--muted-foreground)); }
.feed-item .meta { margin-top: 0.35rem; font-size: 0.75rem; }

.empty {
  padding: 1.25rem;
  text-align: center;
  color: hsl(var(--muted-foreground));
  font-size: 0.9rem;
  border: 1px dashed hsl(var(--border));
  border-radius: var(--radius-lg);
}

/* ---------- skeleton ---------- */
.skeleton {
  min-height: 2.4rem;
  border-radius: var(--radius-md);
  background: linear-gradient(100deg, hsl(var(--muted)) 40%, hsl(var(--accent)) 50%, hsl(var(--muted)) 60%);
  background-size: 200% 100%;
  animation: shimmer 1.4s ease infinite;
}
.stat-card.skeleton { min-height: 4.5rem; }
@keyframes shimmer { to { background-position: -200% 0; } }

/* ---------- footer banner (shared) ---------- */
#site-banner {
  position: fixed;
  left: 50%;
  bottom: 1.25rem;
  transform: translate(-50%, 140%);
  display: flex;
  align-items: center;
  gap: 0.6rem;
  max-width: min(560px, calc(100% - 2rem));
  padding: 0.75rem 1rem;
  font-size: 0.88rem;
  border-radius: var(--radius-lg);
  background: hsl(var(--card));
  color: hsl(var(--foreground));
  box-shadow: 0 12px 32px -8px rgba(0, 0, 0, 0.3);
  border: 1px solid hsl(var(--border));
  opacity: 0;
  pointer-events: none;
  transition: transform 0.3s ease, opacity 0.3s ease;
  z-index: 50;
}
#site-banner.is-show { transform: translate(-50%, 0); opacity: 1; }
#site-banner.is-error { border-color: hsl(var(--destructive)); }
#site-banner.is-error::before { content: "⚠"; color: hsl(var(--destructive)); font-weight: 700; }
#site-banner.is-info { border-color: hsl(var(--ring)); }
#site-banner.is-ok { border-color: hsl(150 50% 40%); }
#site-banner.is-ok::before { content: "✓"; color: hsl(150 50% 40%); font-weight: 700; }
#site-banner-drain {
  position: absolute;
  left: 0;
  bottom: 0;
  height: 3px;
  width: 100%;
  background: hsl(150 50% 40% / 0.7);
  border-radius: 0 0 var(--radius-lg) var(--radius-lg);
  transform-origin: left center;
}
#site-banner.is-error #site-banner-drain { background: hsl(var(--destructive) / 0.7); }

/* ---------- reduced motion ---------- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    transition-duration: 0.001s !important;
    animation-duration: 0.001s !important;
    animation-iteration-count: 1 !important;
  }
}
</style>
</head>

    <section class="columns">

          <div class="skeleton"></div>
          <div class="skeleton"></div>
        </div>
      </div>
    </section>
  </main>

  <div id="site-banner" role="status">
    <span id="site-banner-msg"></span><span id="site-banner-drain" aria-hidden="true"></span>
  </div>

      if (res.ok && res.body && res.body.success && res.body.user) {
        _user = res.body.user;
        return _user;
      }
    } catch (e) { /* network — caller decides */ }
    return null;
  }

  /**
   * Async boot guard. Returns { user, role, redirected }.
   * - no token  → redirect to login, redirected:true
   * - token but user fetch fails → still acknowledges token (defensive)
   */
  async function resolveSession() {
    if (!hasToken()) {
      redirectToLogin();
      return { user: null, role: null, redirected: true };
    }
    const user = await currentUser();
    if (!user) {
      clearSession();
      redirectToLogin();
      return { user: null, role: null, redirected: true };
    }
    return { user: user, role: roleOf(user), redirected: false };
  }

  /** Sync gate for pages that can redirect before async work (cheap). */
  function requireAuth() {
    if (hasToken()) return false;
    redirectToLogin();
    return true;
  }

  function redirectToLogin() {
    global.location.replace("/login.html");
  }

  function clearSession() {
    _user = null;
    It.clearToken();
  }

  /** POST logout (best-effort), then wipe local session + go to login. */
  async function logout() {
    try {
      await It.apiPost(It.CONFIG.routes.logout, {}, { auth: true });
    } catch (e) { /* best-effort */ }
    clearSession();
    redirectToLogin();
  }

  It.session = {
    hasToken: hasToken,
    tokenPayload: tokenPayload,
    decodeJwt: decodeJwt,
    roleOf: roleOf,
    isAdminRole: isAdminRole,
    currentUser: currentUser,
    bootAuth: resolveSession,
    requireAuth: requireAuth,
    redirectToLogin: redirectToLogin,
    clearSession: clearSession,
    logout: logout,
  };
})(window);
</script>
  <script>
/* inlined: assets/js/dashboard.js */
/**
 * dashboard.js — user dashboard (user role only).
 * Boot: no token → login. Token but user fetch fails → wipe + login.
 * Role: super_admin/admin → bounce to admin shell (dashboard is user-scoped).
 * Fetches GET /api/v1/dashboard, /api/v1/dashboard/trips, /api/v1/dashboard/favourites.
 */
(function (global) {
  "use strict";

  const It = global.Itinari;
  const fb = It.feedback;

  const DASH = {
    stats: "/v1/dashboard",
    trips: "/v1/dashboard/trips",
    favs: "/v1/dashboard/favourites",
  };

  function el(id) { return document.getElementById(id); }

  function setStat(id, value) {
    const card = el(id);
    if (!card) return;
    const v = card.querySelector(".stat-value");
    if (v) v.textContent = value;
    card.classList.remove("skeleton");
  }

  function buildCard(title, meta) {
    const div = document.createElement("div");
    div.className = "feed-item";
    const h = document.createElement("h3");
    h.textContent = title || "Untitled";
    const p = document.createElement("p");
    p.textContent = meta || "";
    div.appendChild(h);
    div.appendChild(p);
    return div;
  }

  function renderTrips(items) {
    return items.map(function (t) {
      return buildCard(
        t.destination_name || t.name || t.destination || "Trip",
        "Status: " + (t.status || "—") + (t.start_date ? " · " + t.start_date : "")
      );
    });
  }

  function renderFavs(items) {
    return items.map(function (f) {
      return buildCard(
        f.name || f.title || f.destination || "Place",
        f.address || f.city || f.category || ""
      );
    });
  }

  function setFeed(listEl, items, emptyMsg, render) {
    listEl.textContent = "";
    if (!items || !items.length) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = emptyMsg;
      listEl.appendChild(empty);
      return;
    }
    items.forEach(function (it) { listEl.appendChild(render([it])[0]); });
  }

  function renderProfile(user) {
    const chip = el("user-chip");
    if (!chip) return;
    const name = user ? user.name : "";
    const role = user ? It.session.roleOf(user) : "user";
    el("chip-name").textContent = name;
    el("chip-role").textContent = role;
    chip.hidden = false;
    const first = name.split(" ")[0].replace(/[.]+$/, "") || "there";
    el("greet").textContent = "Welcome back, " + first + ".";
    el("greet-sub").textContent = "Here's what's happening with your travels.";
  }

  function load(user) {
    renderProfile(user);
    const tripsList = el("trips-list");
    const favsList = el("favs-list");

    Promise.all([
      It.apiGet(DASH.stats, { auth: true }),
      It.apiGet(DASH.trips, { auth: true }),
      It.apiGet(DASH.favs, { auth: true }),
    ]).then(function (results) {
      const [statsRes, tripsRes, favsRes] = results;
      const stats = statsRes.ok && statsRes.body && statsRes.body.data ? statsRes.body.data : null;
      if (stats) {
        setStat("stat-total", stats.total_trips ?? "–");
        setStat("stat-pending", stats.trip_statistics ? stats.trip_statistics.pending : "–");
        setStat("stat-planning", stats.trip_statistics ? stats.trip_statistics.planning : "–");
        setStat("stat-booked", stats.trip_statistics ? stats.trip_statistics.booked : "–");
        setStat("stat-completed", stats.trip_statistics ? stats.trip_statistics.completed : "–");
        setStat("stat-cancelled", stats.trip_statistics ? stats.trip_statistics.cancelled : "–");
        setStat("stat-favs", stats.total_favourites ?? "–");
      } else {
        ["stat-total","stat-pending","stat-planning","stat-booked","stat-completed","stat-cancelled","stat-favs"].forEach(function (id) {
          setStat(id, "–");
        });
      }

      const trips = tripsRes.ok && tripsRes.body && tripsRes.body.data ? tripsRes.body.data : [];
      setFeed(tripsList, trips, "No trips yet. Start planning your next adventure!", renderTrips);

      const favs = favsRes.ok && favsRes.body && favsRes.body.data ? favsRes.body.data : [];
      setFeed(favsList, favs, "No favourites saved yet.", renderFavs);
    }).catch(function (err) {
      fb.banner(err.message || "Could not load your dashboard.", "is-error");
      setFeed(tripsList, [], "Could not load trips.", renderTrips);
      setFeed(favsList, [], "Could not load favourites.", renderFavs);
    });
  }

  function boot() {
    // no token → login
    if (!It.session.hasToken()) {
      It.session.redirectToLogin();
      return;
    }
    // token but profile fails → wipe + login (defensive)
    It.session.currentUser().then(function (user) {
      if (!user) {
        It.session.clearSession();
        It.session.redirectToLogin();
        return;
      }
      const role = It.session.roleOf(user);
      // dashboard is user-scoped — admins go to the admin shell
      if (It.session.isAdminRole(role)) {
        global.location.replace(It.CONFIG.role.admin);
        return;
      }
      load(user);
    });
  }

  document.addEventListener("DOMContentLoaded", function () {
    const btn = el("logout-btn");
    if (btn) btn.addEventListener("click", function () { It.session.logout(); });
    boot();
  });
})(window);
</script>
