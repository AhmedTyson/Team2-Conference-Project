<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot password · Itinari</title>
  <!-- inlined: assets/css/auth.css -->
<style>
/* ============================================================
   auth.css — Itinari auth pages
   Itinari design tokens (imported) + split-screen layout
   ============================================================ */

@import url("tokens.css?v=3");

/* ---------- base ---------- */
* { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  font-family: var(--font-body);
  background: hsl(var(--background));
  color: hsl(var(--foreground));
  -webkit-font-smoothing: antialiased;
  display: grid;
  place-items: center;
  padding: var(--space-5);
}

/* ---------- split-screen layout ---------- */
.auth-shell {
  display: grid;
  grid-template-columns: 1.1fr 1fr;
  width: min(1080px, 100%);
  min-height: min(680px, 92vh);
  border-radius: var(--radius-xl);
  overflow: hidden;
  box-shadow: 0 24px 70px -24px rgba(0, 0, 0, 0.25);
}

.auth-visual {
  position: relative;
  background:
    radial-gradient(120% 120% at 0% 0%, hsl(240 10% 10%), hsl(240 8% 6%) 60%);
  color: #fff;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 2.5rem;
}

.auth-visual::after {
  content: "";
  position: absolute;
  inset: 0;
  background:
    linear-gradient(135deg, rgba(255,255,255,0.08) 25%, transparent 25%) 0 0 / 48px 48px,
    linear-gradient(315deg, rgba(255,255,255,0.08) 25%, transparent 25%) 0 0 / 48px 48px;
  opacity: 0.35;
  pointer-events: none;
}

.auth-visual h1 { font-size: 1.75rem; line-height: 1.2; margin: 0 0 0.5rem; position: relative; z-index: 1; }
.auth-visual p { margin: 0; opacity: 0.92; max-width: 34ch; position: relative; z-index: 1; }
.auth-visual .brand { position: relative; z-index: 1; font-weight: 800; letter-spacing: -0.02em; font-size: 1.25rem; }

.auth-form-side {
  background: hsl(var(--card));
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2.5rem;
}

/* ---------- card ---------- */
.auth-card {
  width: min(400px, 100%);
}

.auth-card h2 { margin: 0 0 0.25rem; font-size: 1.5rem; letter-spacing: -0.02em; }
.auth-card .sub { margin: 0 0 1.75rem; color: hsl(var(--muted-foreground)); font-size: 0.9rem; }

/* ---------- fields ---------- */
.field { margin-bottom: var(--space-4); }

.field label {
  display: block;
  font-size: 0.8rem;
  font-weight: 600;
  margin-bottom: 0.4rem;
}

.field input {
  width: 100%;
  padding: 0.6rem 0.8rem;
  font-size: 0.95rem;
  font-family: inherit;
  color: hsl(var(--foreground));
  background: hsl(var(--background));
  border: 1px solid hsl(var(--input));
  border-radius: var(--radius-sm);
  outline: none;
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}

.field input::placeholder { color: hsl(var(--muted-foreground) / 0.7); }

/* password show/hide wrapper (phase 5) */
.input-wrap {
  position: relative;
}
.input-wrap input[type="password"],
.input-wrap input[type="text"] {
  padding-right: 2.75rem;
}
.pw-toggle {
  position: absolute;
  top: 50%;
  right: 0.4rem;
  transform: translateY(-50%);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 2rem;
  height: 2rem;
  padding: 0;
  border: none;
  border-radius: var(--radius-md);
  background: transparent;
  color: hsl(var(--muted-foreground));
  cursor: pointer;
  font-size: 1.05rem;
  line-height: 1;
  transition: color 0.15s ease, background 0.15s ease;
}
.pw-toggle:hover { color: hsl(var(--foreground)); background: hsl(var(--muted) / 0.4); }
.pw-toggle:focus-visible {
  outline: none;
  box-shadow: 0 0 0 2px hsl(var(--ring) / 0.4);
}

.field input:focus-visible {
  border-color: hsl(var(--ring));
  box-shadow: 0 0 0 3px hsl(var(--ring) / 0.25);
}

/* error states */
.field.has-error input:not([type="checkbox"]),
.field input.is-error:not([type="checkbox"]) {
  border-color: hsl(var(--destructive));
}

.field input.is-invalid-ring {
  border-color: hsl(var(--destructive));
  box-shadow: 0 0 0 3px hsl(var(--destructive) / 0.2);
}

/* valid states (phase 4) */
.field input.is-valid:not([type="checkbox"]) {
  border-color: hsl(150 55% 46%);
  box-shadow: 0 0 0 3px hsl(150 55% 46% / 0.18);
}

.field-hint {
  display: none;
  margin-top: 0.35rem;
  font-size: 0.78rem;
  color: hsl(var(--destructive));
}

.field-hint.show { display: block; }

.field-hint.hint-valid { color: hsl(150 55% 38%); }

/* password strength meter (phase 4) */
.strength-meter {
  display: flex;
  gap: 0.3rem;
  margin-top: 0.4rem;
}
.strength-meter .bar {
  flex: 1;
  height: 4px;
  border-radius: var(--radius-full);
  background: hsl(var(--muted));
  transition: background 0.2s ease;
}
.strength-meter.weak .bar:nth-child(1) { background: hsl(var(--destructive)); }
.strength-meter.fair .bar:nth-child(-n+3) { background: hsl(38 92% 56%); }
.strength-meter.strong .bar:nth-child(-n+5) { background: hsl(150 55% 46%); }

.strength-note {
  margin-top: 0.3rem;
  font-size: 0.75rem;
  color: hsl(var(--muted-foreground));
}
.strength-note.weak { color: hsl(var(--destructive)); }
.strength-note.fair { color: hsl(38 92% 42%); }
.strength-note.strong { color: hsl(150 55% 38%); }

.hint-list {
  margin-top: 0.35rem;
  font-size: 0.75rem;
  color: hsl(var(--muted-foreground));
}
.hint-list li { margin: 0.1rem 0; }
.hint-list li.met { color: hsl(150 55% 38%); }
.hint-list li.met::before { content: "✓ "; }

/* terms checkbox (phase 5) */
.terms-field {
  display: flex;
  align-items: flex-start;
  gap: var(--space-2);
  margin: 0.25rem 0 1rem;
}
.terms-field input[type="checkbox"] {
  width: 1rem;
  height: 1rem;
  margin-top: 0.1rem;
  accent-color: hsl(var(--primary));
}
.terms-field label {
  font-size: 0.82rem;
  font-weight: 400;
  color: hsl(var(--muted-foreground));
  margin: 0;
}
.terms-field label a { color: hsl(var(--primary)); font-weight: 600; }
.terms-field.has-error label { color: hsl(var(--destructive)); }
.terms-field.has-error input[type="checkbox"] {
  outline: 2px solid hsl(var(--destructive) / 0.5);
  outline-offset: 2px;
}

/* email availability hint (phase 5) */
.hint-availability {
  color: hsl(var(--muted-foreground));
}
.hint-availability.checking { color: hsl(var(--muted-foreground)); }
.hint-availability.available { color: hsl(150 55% 38%); }
.hint-availability.taken { color: hsl(var(--destructive)); }
.hint-availability::before { content: "… "; }
.hint-availability.available::before { content: "✓ "; }
.hint-availability.taken::before { content: "✗ "; }

/* ---------- actions ---------- */
.btn-primary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  width: 100%;
  padding: 0.65rem 1rem;
  font-size: 0.95rem;
  font-weight: 600;
  font-family: inherit;
  color: hsl(var(--primary-foreground));
  background: hsl(var(--primary));
  border: none;
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: background 0.15s ease, transform 0.1s ease;
}

.btn-primary:hover:not(:disabled) { background: hsl(var(--primary) / 0.88); }
.btn-primary:active:not(:disabled) { transform: scale(0.98); }
.btn-primary:disabled { opacity: 0.65; cursor: not-allowed; }

/* loading spinner (spec #2) */
.btn-primary.is-loading .btn-label { opacity: 0.75; }
.spinner {
  display: none;
  width: 1rem;
  height: 1rem;
  border: 2px solid hsl(var(--primary-foreground) / 0.35);
  border-top-color: hsl(var(--primary-foreground));
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
.btn-primary.is-loading .spinner { display: inline-block; }

@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- success note ---------- */
.success-note {
  display: none;
  margin-top: var(--space-4);
  padding: 0.7rem 0.9rem;
  font-size: 0.85rem;
  color: hsl(150 60% 28%);
  background: hsl(150 60% 92%);
  border-radius: var(--radius-md);
}
.success-note.is-show { display: block; }

/* ---------- links ---------- */
.auth-links {
  margin-top: 1.25rem;
  font-size: 0.85rem;
  text-align: center;
  color: hsl(var(--muted-foreground));
}
.auth-links a { color: hsl(var(--primary)); font-weight: 600; text-decoration: none; }
.auth-links a:hover { text-decoration: underline; }
.auth-links .sep { margin: 0 0.4rem; opacity: 0.5; }

/* ---------- site banner ---------- */
#site-banner {
  position: fixed;
  left: 50%;
  bottom: 1.25rem;
  transform: translate(-50%, 140%);
  display: flex;
  align-items: center;
  gap: 0.6rem;
  max-width: min(560px, calc(100% - 2rem));
  padding: 0.75rem 1rem;
  font-size: 0.88rem;
  border-radius: var(--radius-lg);
  background: hsl(var(--card));
  color: hsl(var(--foreground));
  box-shadow: 0 12px 32px -8px rgba(0, 0, 0, 0.3);
  border: 1px solid hsl(var(--border));
  opacity: 0;
  pointer-events: none;
  transition: transform 0.3s ease, opacity 0.3s ease;
  z-index: 50;
}
#site-banner.is-show { transform: translate(-50%, 0); opacity: 1; }
#site-banner.is-error { border-color: hsl(var(--destructive)); }
#site-banner.is-error::before {
  content: "⚠";
  color: hsl(var(--destructive));
  font-weight: 700;
}
#site-banner.is-info { border-color: hsl(var(--ring)); }
#site-banner.is-ok { border-color: hsl(150 50% 40%); }
#site-banner.is-ok::before {
  content: "✓";
  color: hsl(150 50% 40%);
  font-weight: 700;
}

/* banner progress drain (phase 6) */
#site-banner-drain {
  position: absolute;
  left: 0;
  bottom: 0;
  height: 3px;
  width: 100%;
  background: hsl(150 50% 40% / 0.7);
  border-radius: 0 0 var(--radius-lg) var(--radius-lg);
  transform-origin: left center;
}
#site-banner.is-error #site-banner-drain { background: hsl(var(--destructive) / 0.7); }

/* ---------- responsive ---------- */
@media (max-width: 820px) {
  .auth-shell { grid-template-columns: 1fr; }
  .auth-visual { display: none; }
  body { padding: 0; }
.auth-form-side { min-height: 100vh; }
}
  .field input.is-valid:not([type="checkbox"]),
  .field input.is-invalid-ring {
    box-shadow: none;
  }

</style>
</head>

      <div>
        <h1>Lost your password?</h1>
        <p>No stress. Enter your email and we'll send a reset link.</p>
      </div>
    </section>

    <section class="auth-form-side">

          <button type="submit" class="btn-primary">
            <span class="spinner"></span>
            <span class="btn-label">Send reset link</span>

  </main>

  <div id="site-banner" role="status">
    <span id="site-banner-msg"></span><span id="site-banner-drain" aria-hidden="true"></span>
  </div>

    if (!el) return;

    if (msgEl) msgEl.textContent = msg;
    el.classList.remove("is-error", "is-info", "is-ok");
    if (tone) el.classList.add(tone);

    const g = global.gsap;
    if (g && !reducedMotion()) {
      g.killTweensOf(el);
      g.fromTo(el, { autoAlpha: 0, y: 12 }, { autoAlpha: 1, y: 0, duration: 0.35, ease: "power2.out" });
    }
    el.classList.add("is-show");

    const drain = document.getElementById("site-banner-drain");
    if (drain) {
      if (g && !reducedMotion()) {
        g.killTweensOf(drain);
        g.set(drain, { transformOrigin: "left center", scaleX: 1 });
        g.to(drain, { scaleX: 0, duration: 5, ease: "linear" });
      } else {
        drain.style.transform = "scaleX(1)";
      }
    }

    clearTimeout(banner.__t);
    banner.__t = setTimeout(function () {
      if (g && !reducedMotion()) {
        g.killTweensOf(el);
        g.to(el, { autoAlpha: 0, y: 12, duration: 0.25, ease: "power2.in", onComplete: function () {
          el.classList.remove("is-show");
        } });
      } else {
        el.classList.remove("is-show");
      }
    }, 5000);
  }

  /** toast stack (bottom-right) — Phase 17 shadcn-style notifications */
  function toast(msg, tone, opts) {
    const g = global.gsap;
    const stack = document.querySelector(".toast-stack") ||
      (function () {
        const s = document.createElement("div");
        s.className = "toast-stack";
        s.setAttribute("aria-live", "polite");
        s.setAttribute("aria-relevant", "additions");
        document.body.appendChild(s);
        return s;
      })();

    const t = document.createElement("div");
    t.className = "toast " + (tone || "is-info");
    if (tone === "ok") t.setAttribute("role", "status");
    else if (tone === "error") t.setAttribute("role", "alert");
    const icon = document.createElement("span");
    icon.className = "toast-icon";
    icon.setAttribute("aria-hidden", "true");
    icon.textContent = tone === "ok" ? "OK" : tone === "error" ? "!" : "i";
    const text = document.createElement("span");
    text.textContent = msg;
    const close = document.createElement("button");
    close.type = "button";
    close.className = "toast-close";
    close.setAttribute("aria-label", "Dismiss");
    close.textContent = "\u00d7";
    const drain = document.createElement("span");
    drain.className = "toast-drain";
    drain.setAttribute("aria-hidden", "true");
    t.appendChild(icon);
    t.appendChild(text);
    t.appendChild(close);
    t.appendChild(drain);

    const action = (opts && opts.action) || null;
    const holdMs = action ? 9000 : 4300;
    if (action) t.classList.add("is-action");

    function dismiss() {
      if (g && !reducedMotion()) {
        g.to(t, { autoAlpha: 0, y: 6, duration: 0.2, ease: "power2.in", onComplete: function () { t.remove(); } });
      } else {
        t.remove();
      }
    }
    if (action) {
      const undo = document.createElement("button");
      undo.type = "button";
      undo.className = "toast-undo";
      undo.textContent = action.label || "Undo";
      undo.addEventListener("click", function () {
        clearTimeout(t.__t);
        dismiss();
        if (typeof action.onClick === "function") action.onClick();
      });
      t.appendChild(undo);
      t.querySelector(".toast-close").addEventListener("click", function () { clearTimeout(t.__t); dismiss(); });
    }

    stack.appendChild(t);

    if (g && !reducedMotion()) {
      g.fromTo(t, { autoAlpha: 0, y: 10, scale: 0.97 }, { autoAlpha: 1, y: 0, scale: 1, duration: 0.25, ease: "power2.out" });
      g.fromTo(drain, { scaleX: 1 }, { scaleX: 0, duration: holdMs / 1000, ease: "linear", delay: 0.2 });
    } else {
      drain.style.transform = "scaleX(1)";
      drain.style.transition = "transform " + (holdMs / 1000) + "s linear 0.2s";
      drain.style.transformOrigin = "left center";
    }

    close.addEventListener("click", dismiss);
    t.__t = setTimeout(dismiss, holdMs + 200);
    while (stack.children.length > 4) stack.firstElementChild.remove();
  }

  It.feedback = {
    shakeField: shakeField,
    validFlicker: validFlicker,
    successPulse: successPulse,
    loading: loading,
    flashNote: flashNote,
    banner: banner,
    toast: toast,
  };
})(window);
</script>
  <script>
/* inlined: assets/js/session.js */
/**
 * session.js — auth/session + role resolution.
 * Depends on config.js (CONFIG, readToken, clearToken) + api.js (apiGet, apiPost).
 * No DOM, no animation.
 */
(function (global) {
  "use strict";

  const It = global.Itinari;

  // cached profile so boot role resolution hits /api/user at most once
  let _user = null;

  /** Decode a JWT payload (display only — no signature verification). */
  function decodeJwt(token) {
    if (!token) return null;
    try {
      const part = token.split(".")[1];
      if (!part) return null;
      const b64 = part.replace(/-/g, "+").replace(/_/g, "/");
      const json = decodeURIComponent(
        atob(b64).split("").map(function (c) {
          return "%" + ("00" + c.charCodeAt(0).toString(16)).slice(-2);
        }).join("")
      );
      return JSON.parse(json);
    } catch (e) { return null; }
  }

  /** Payload of stored token (sub/id). Null when no token or undecodable. */
  function tokenPayload() {
    const token = It.readToken();
    if (!token) return null;
    return decodeJwt(token);
  }

  function hasToken() {
    return !!It.readToken();
  }

  /** First meaningful/role from a user's roles list. */
  function roleOf(user) {
    if (!user) return null;
    let list = user.roles || user.role;
    if (typeof list === "string") list = [list];
    list = list || [];
    if (list.indexOf("super_admin") !== -1) return "super_admin";
    if (list.indexOf("admin") !== -1) return "admin";
    return list.length ? list[0] : null;
  }

  function isAdminRole(role) {
    return role === "admin" || role === "super_admin";
  }

  /**
   * Resolve current user: cached profile, else GET /api/user (Bearer).
   * Resolves null on no token / failure. Never throws.
   */
  async function currentUser() {
    if (_user) return _user;
    const payload = tokenPayload();
    if (!payload) return null;
    try {
      const res = await It.apiGet(It.CONFIG.routes.me, { auth: true });
      if (res.ok && res.body && res.body.success && res.body.user) {
        _user = res.body.user;
        return _user;
      }
    } catch (e) { /* network — caller decides */ }
    return null;
  }

  /**
   * Async boot guard. Returns { user, role, redirected }.
   * - no token  → redirect to login, redirected:true
   * - token but user fetch fails → still acknowledges token (defensive)
   */
  async function resolveSession() {
    if (!hasToken()) {
      redirectToLogin();
      return { user: null, role: null, redirected: true };
    }
    const user = await currentUser();
    if (!user) {
      clearSession();
      redirectToLogin();
      return { user: null, role: null, redirected: true };
    }
    return { user: user, role: roleOf(user), redirected: false };
  }

  /** Sync gate for pages that can redirect before async work (cheap). */
  function requireAuth() {
    if (hasToken()) return false;
    redirectToLogin();
    return true;
  }

  function redirectToLogin() {
    global.location.replace("/login.html");
  }

  function clearSession() {
    _user = null;
    It.clearToken();
  }

  /** POST logout (best-effort), then wipe local session + go to login. */
  async function logout() {
    try {
      await It.apiPost(It.CONFIG.routes.logout, {}, { auth: true });
    } catch (e) { /* best-effort */ }
    clearSession();
    redirectToLogin();
  }

  It.session = {
    hasToken: hasToken,
    tokenPayload: tokenPayload,
    decodeJwt: decodeJwt,
    roleOf: roleOf,
    isAdminRole: isAdminRole,
    currentUser: currentUser,
    bootAuth: resolveSession,
    requireAuth: requireAuth,
    redirectToLogin: redirectToLogin,
    clearSession: clearSession,
    logout: logout,
  };
})(window);
</script>
  <script>
/* inlined: assets/js/auth.js */
/**
 * auth.js — page glue. Wires forms to api.js + validation.js + animations.js.
 * Contains ZERO animation code and ZERO validation rules of its own:
 *   - rules come from Itinari.Rules (validation.js)
 *   - visuals come from Itinari.feedback (animations.js)
 *   - transport comes from Itinari.apiPost (api.js)
 */
(function (global) {
  "use strict";

  const It = global.Itinari;
  const R = It.Rules;
  const fb = It.feedback;

  /* ------------------------------------------------------------------ */
  /* page configuration                                                  */
  /* ------------------------------------------------------------------ */

  const PAGES = {
    login: {
      route: "login",
      fields: {
        email: { on: "blur", rules: [R.required, R.email] },
        password: { on: "blur", rules: [R.required] },
      },
      successNote: "li-success-note",
onSuccess: function (body, form) {
        const token = It.extractToken(body);
        if (token) It.storeToken(token);
        fb.banner("Logged in — taking you to your dashboard…", "is-ok");
        setTimeout(function () {
          // role-aware landing: admin → admin shell, everyone else → user dashboard
          const user = (body && body.user) || It._cachedUser;
          const role = It.session.roleOf(user);
          global.location.href = It.session.isAdminRole(role) ? It.CONFIG.adminUrl : It.CONFIG.dashboardUrl;
        }, 900);
      },
    },

    register: {
      route: "register",
      fields: function (form) {
        return {
          name: { on: "blur", rules: [R.required] },
          email: { on: "blur", rules: [R.required, R.email] },
          password: { on: "input", rules: [R.required, R.password] },
          password_confirmation: {
            on: "input",
            rules: [R.required, R.match(function () { return form.elements.password.value; })],
          },
          terms: { on: "change", rules: [R.required] },
        };
      },
      successNote: "rg-success-note",
      onSuccess: function (body, form) {
        const token = It.extractToken(body);
        if (token) It.storeToken(token);
        const email = form.elements.email.value;
        fb.banner("Account created — check your inbox to verify.", "is-ok");
        setTimeout(function () {
          global.location.href = "verify.html" + (email ? "?email=" + encodeURIComponent(email) : "");
        }, 900);
      },
    },

    forgot: {
      route: "forgot",
      fields: {
        email: { on: "blur", rules: [R.required, R.email] },
      },
      successNote: "fo-success-note",
      onSuccess: function () {
        fb.banner("If an account exists, a reset link is on its way.", "is-ok");
      },
    },

    reset: {
      route: "reset",
      fields: function (form) {
        return {
          email: { on: "blur", rules: [R.required, R.email] },
          token: { on: "blur", rules: [R.required] },
          password: { on: "input", rules: [R.required, R.password] },
          password_confirmation: {
            on: "input",
            rules: [R.required, R.match(function () { return form.elements.password.value; })],
          },
        };
      },
      successNote: "rv-success-note",
      onSuccess: function () {
        fb.banner("Password updated — redirecting to log in…", "is-ok");
        setTimeout(function () {
          global.location.href = "login.html";
        }, 1400);
      },
    },
  };

  /* ------------------------------------------------------------------ */
  /* field controller: validation state on DOM                           */
  /* ------------------------------------------------------------------ */

  function createField(form, name, cfg) {
    const input = form.elements[name];
    if (!input) return null;
    const hint = document.getElementById("hint-" + name);

    function setState(err, checked) {
      const group = input.closest(".field");
      if (group) group.classList.toggle("has-error", !!err);
      input.classList.toggle("is-error", !!err);
      input.classList.toggle("is-valid", checked && !err);
      input.setAttribute("aria-invalid", err ? "true" : "false");
      if (hint) {
        hint.textContent = err || "";
        hint.classList.toggle("show", !!err);
      }
    }

    function validate(opts) {
      const isCheckbox = input.type === "checkbox";
      const value = isCheckbox ? input.checked : input.value;
      let err = It.validate(value, cfg.rules);
      if (err && isCheckbox && name === "terms") err = "Please accept the terms to continue.";
      setState(err, true);
      if (err && opts && opts.shake) fb.shakeField(isCheckbox ? input.closest(".terms-field") : input);
      if (!err) fb.validFlicker(isCheckbox ? input : input);
      return err;
    }

    function showError(msg, shake) {
      setState(msg, false);
      if (shake) fb.shakeField(input);
    }

    // live validation wiring (spec #5: blur for email, keystroke for passwords)
    input.addEventListener(cfg.on, function () {
      validate({ shake: false });
    });
    if (cfg.on === "blur") {
      input.addEventListener("input", function () { setState(null); });
    }
    // password confirm re-checks on the other field's keystrokes too
    if (name === "password_confirmation") {
      const other = form.elements.password;
      if (other) other.addEventListener("input", function () { validate({ shake: false }); });
    }

    return { name, input, validate, showError, clear: () => setState(null) };
  }

  /* ------------------------------------------------------------------ */
  /* phase 5: email availability + strength meter                        */
  /* ------------------------------------------------------------------ */

  // placeholder seed list — swap for real /register availability endpoint later
  const TAKEN_EMAILS = ["admin@threedos.com", "user@example.com", "ada@lovelace.dev"];

  function normalizeEmail(raw) {
    return String(raw || "").trim().toLowerCase();
  }

  function syncStrength(input) {
    const meter = document.getElementById("pw-meter");
    const note = document.getElementById("pw-strength-note");
    const list = document.getElementById("pw-checklist");
    if (!meter) return;
    const r = It.passwordStrength(input.value);
    meter.className = r.score === 0 ? "strength-meter" : "strength-meter " + r.level;
    if (note) {
      note.textContent = r.score === 0 ? "" : (r.level === "weak" ? "Weak — add more variety." : r.level === "fair" ? "Fair — getting stronger." : "Strong — looks great!");
      note.className = r.score === 0 ? "strength-note" : "strength-note " + r.level;
    }
    if (list) {
      Array.prototype.forEach.call(list.children, function (li) {
        const met = r.checks[li.dataset.check];
        li.classList.toggle("met", !!met);
      });
    }
  }

  function wirePasswordExtras(input) {
    if (!input) return;
    input.addEventListener("input", function () { syncStrength(input); });
    syncStrength(input);
  }

  function wireEmailAvailability(input, availEl) {
    if (!input || !availEl) return;
    let timer = null;
    input.addEventListener("input", function () {
      clearTimeout(timer);
      availEl.className = "hint-availability";
      availEl.textContent = "";
      const raw = input.value.trim();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(raw)) return; // don't check malformed
      availEl.className = "hint-availability checking";
      availEl.textContent = "Checking availability…";
      timer = setTimeout(function () {
        const taken = TAKEN_EMAILS.indexOf(normalizeEmail(raw)) !== -1;
        availEl.className = "hint-availability " + (taken ? "taken" : "available");
        availEl.textContent = taken ? "This email is already registered." : "This email is available.";
      }, 400);
    });
  }

  /* ------------------------------------------------------------------ */
  /* submit flow (spec #1-4)                                             */
  /* ------------------------------------------------------------------ */

  function collectPayload(fields) {
    const payload = {};
    fields.forEach(function (f) { payload[f.name] = f.input.value; });
    return payload;
  }

  function validateAll(fields, shake) {
    let firstBad = null;
    fields.forEach(function (f) {
      const err = f.validate({ shake: shake });
      if (err && !firstBad) firstBad = f;
    });
    return firstBad;
  }

  function mapServerErrors(fields, errors) {
    let handled = false;
    Object.keys(errors || {}).forEach(function (key) {
      const f = fields.find(function (f) { return f.name === key; });
      if (f) {
        f.showError((errors[key] || ["Invalid value."])[0], true); // spec #4: shake + red border on invalid fields only
        handled = true;
      }
    });
    return handled;
  }

  function initForm(pageName, cfg) {
    const form = document.getElementById("auth-form");
    if (!form) return;
    form.setAttribute("novalidate", "novalidate");

    const fieldDefs = typeof cfg.fields === "function" ? cfg.fields(form) : cfg.fields;

    const fields = [];
    Object.keys(fieldDefs).forEach(function (name) {
      const f = createField(form, name, fieldDefs[name]);
      if (f) fields.push(f);
    });

    // phase 5: password strength meter on register + reset
    if (pageName === "register" || pageName === "reset") {
      wirePasswordExtras(form.elements.password);
    }
    // phase 5: debounced email availability on register
    if (pageName === "register") {
      wireEmailAvailability(form.elements.email, document.getElementById("avail-email"));
    }

    form.addEventListener("submit", async function (e) {
      e.preventDefault(); // spec #1
      if (form.dataset.busy === "1") return;

      // local inline validation before hitting the server (spec #5)
      const bad = validateAll(fields, true);
      if (bad) { bad.input.focus(); return; }

      const btn = form.querySelector('button[type="submit"]');
      fb.loading(btn, true); // spec #2
      form.dataset.busy = "1";

      try {
        const res = await It.apiPost(It.CONFIG.routes[cfg.route] || cfg.route, collectPayload(fields));
        if (res.ok) {
          fb.successPulse(form); // spec #3
          cfg.onSuccess(res.body, form);
        } else if (It.isFieldErrors(res.body)) {
          // spec #4: 422 → per-field inline errors
          mapServerErrors(fields, res.body.errors);
        } else {
          fb.banner((res.body && res.body.message) || "Request failed. Please try again.", "is-error");
        }
      } catch (err) {
        fb.banner(err.message || "Network error. Please try again.", "is-error");
      } finally {
        fb.loading(btn, false);
        form.dataset.busy = "0";
      }
    });
  }

  /* ------------------------------------------------------------------ */
  /* verify page: resend link                                            */
  /* ------------------------------------------------------------------ */

  function initVerify() {
    const btn = document.getElementById("v-resend");
    if (!btn) return;

    // prefill email from ?email= query (set by register.html redirect)
    const q = new URLSearchParams(global.location.search);
    const email = q.get("email");
    const emailSrc = document.getElementById("v-email-src");
    if (email && emailSrc) emailSrc.value = email;
    const sub = document.querySelector('.auth-card .sub');
    if (email && sub) sub.textContent = "We sent a verification link to " + email + ". Follow it to activate your account.";

    btn.addEventListener("click", async function () {
      const token = It.readToken();
      if (!token) {
        fb.banner("No active session. Log in, then resend verification.", "is-error");
        return;
      }
      fb.loading(btn, true);
      try {
        const res = await It.apiPost(It.CONFIG.routes.resend, {}, { headers: { Authorization: "Bearer " + token } });
        if (res.ok) fb.banner((res.body && res.body.message) || "Verification link sent.", "is-info");
        else fb.banner((res.body && res.body.message) || "Could not send the link.", "is-error");
      } catch (err) {
        fb.banner(err.message || "Could not reach the server.", "is-error");
      } finally {
        fb.loading(btn, false);
      }
    });
  }

  /* ------------------------------------------------------------------ */
  /* boot                                                                */
  /* ------------------------------------------------------------------ */

  document.addEventListener("DOMContentLoaded", function () {
    const page = document.body.dataset.page;
    if (PAGES[page]) initForm(page, PAGES[page]);
    if (page === "verify") initVerify();
  });
})(window);
</script>
