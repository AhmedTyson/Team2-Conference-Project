<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile Settings · Itinari</title>
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="css/components/navbar.css" />
  <link rel="stylesheet" href="css/components/buttons.css" />
  <link rel="stylesheet" href="css/components/modal.css" />
  <link rel="stylesheet" href="css/components/toast.css" />
  <link rel="stylesheet" href="assets/css/dashboard.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    .profile-layout { display: grid; grid-template-columns: 300px 1fr; gap: 1.6rem; margin-top: 1rem; }
    @media (max-width: 860px) { .profile-layout { grid-template-columns: 1fr; } }
    .profile-card { background: #141414; border: 1px solid rgba(255,255,255,0.1); border-radius: 18px; padding: 1.6rem; }
    .avatar-wrap { display: flex; flex-direction: column; align-items: center; gap: 1rem; text-align: center; }
    .avatar-lg { width: 96px; height: 96px; border-radius: 50%; background: linear-gradient(135deg, #3b7cff, #7aa5ff); color: #0a0a0a; display: flex; align-items: center; justify-content: center; font-size: 2.4rem; font-weight: 700; font-family: 'Outfit', sans-serif; overflow: hidden; }
    .avatar-lg img { width: 100%; height: 100%; object-fit: cover; }
    .avatar-actions { display: flex; gap: .6rem; flex-wrap: wrap; justify-content: center; }
    .avatar-actions .btn { padding: 6px 14px; font-size: 12px; border-radius: 40px; }
    .profile-form .form-group { margin-bottom: 1.3rem; }
    .profile-form label { display: block; font-weight: 600; font-size: .82rem; color: rgba(255,255,255,0.75); margin-bottom: 6px; }
    .profile-form input[type="text"], .profile-form input[type="email"], .profile-form input[type="tel"], .profile-form input[type="password"] {
      width: 100%; padding: .75rem 1rem; border-radius: 12px; border: 1px solid rgba(255,255,255,0.15); font-size: .95rem; background: rgba(255,255,255,0.05); color: #ffffff; outline: none; transition: border-color .15s, box-shadow .15s; box-sizing: border-box;
    }
    .profile-form input:focus { border-color: #7aa5ff; box-shadow: 0 0 0 3px rgba(122,165,255,0.15); }
    .profile-form .hint { font-size: .74rem; color: rgba(255,255,255,0.5); margin-top: 5px; }
    .form-section-title { font-size: .74rem; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: rgba(255,255,255,0.45); margin: 1.8rem 0 .9rem; }
    .field-error { color: #f87171; font-size: .78rem; margin-top: 5px; display: none; }
    .field-error.is-show { display: block; }
    .is-invalid-ring { border-color: #f87171 !important; }
    .profile-actions { display: flex; gap: .8rem; margin-top: 1.4rem; }
    .btn-primary { background: #ffffff; color: #0a0a0a; border: none; padding: .65rem 1.7rem; border-radius: 40px; font-weight: 600; font-size: .9rem; cursor: pointer; transition: background .15s; }
    .btn-primary:hover { background: rgba(255,255,255,0.85); }
    .btn-outline { background: transparent; border: 1px solid rgba(255,255,255,0.2); color: rgba(255,255,255,0.8); padding: .6rem 1.5rem; border-radius: 40px; font-weight: 600; font-size: .9rem; cursor: pointer; }
    .btn-outline:hover { background: rgba(255,255,255,0.08); }
    .btn-ghost { background: transparent; border: none; color: #f87171; padding: .6rem 1.2rem; border-radius: 40px; font-weight: 600; font-size: .9rem; cursor: pointer; }
    .is-loading { opacity: .6; pointer-events: none; }
    .file-input-hidden { display: none; }
    .section-divider { border: none; border-top: 1px solid rgba(255,255,255,0.1); margin: 1.8rem 0; }
  </style>
</head>
<body data-page="profile">

  <div class="app-container">

    <!-- Sidebar Navigation -->
    <aside class="sidebar">
      <div class="logo-section">
        <span class="logo-icon"></span>
        <span>Itinari</span>
      </div>
      <ul class="nav-menu">
        <li class="nav-item">
          <a class="nav-link" href="dashboard.html">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" style="margin-right:14px; width:20px; height:20px; stroke-width:2.2;"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2H6a2 2 0 01-2-2v-4zM14 16a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2h-2a2 2 0 01-2-2v-4z"></path></svg>
            Dashboard
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="bookings.html">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" style="margin-right:14px; width:20px; height:20px; stroke-width:2.2;"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>
            My Bookings
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="favourites.html">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" style="margin-right:14px; width:20px; height:20px; stroke-width:2.2;"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
            Favourites
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link active" href="profile.html">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" style="margin-right:14px; width:20px; height:20px; stroke-width:2.2;"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
            Profile
          </a>
        </li>
      </ul>
      <div class="user-profile">
        <div class="avatar" id="avatar-letters">U</div>
        <div class="user-info">
          <h4 id="user-display-name">Loading...</h4>
          <p id="user-display-role">User</p>
        </div>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
      <header class="top-bar">
        <h2 id="page-title">Profile Settings</h2>
        <div>
          <button type="button" id="logout-btn" class="btn-outline" style="padding: 6px 14px; font-size: 12px; border-radius: 40px;">Log out</button>
        </div>
      </header>

      <div class="greet">
        <h1>Profile Settings</h1>
        <p class="sub">Manage your personal details, avatar and password.</p>
      </div>

      <div class="profile-layout">
        <!-- Identity / avatar card -->
        <section class="profile-card">
          <div class="avatar-wrap">
            <div class="avatar-lg" id="avatar-preview">U</div>
            <div class="avatar-actions">
              <button type="button" id="upload-avatar-btn" class="btn-outline"><i class="fas fa-camera"></i> Change photo</button>
              <button type="button" id="remove-avatar-btn" class="btn-ghost" hidden><i class="fas fa-trash"></i> Remove</button>
            </div>
            <input type="file" id="avatar-file-input" class="file-input-hidden" accept="image/*">
            <p class="hint" id="avatar-filename"></p>
            <p class="hint" style="margin-top:0;">JPG, PNG or GIF up to 2 MB.</p>
          </div>
          <hr class="section-divider">
          <div class="fav-meta" style="font-size:.82rem; color:rgba(255,255,255,0.55);">
            <p><i class="fas fa-envelope"></i> <span id="profile-email-static">–</span></p>
            <p><i class="fas fa-user-tag"></i> <span id="profile-role-static">Member</span></p>
          </div>
        </section>

        <!-- Edit form -->
        <section class="profile-card profile-form">
          <form id="profile-form" novalidate>
            <div class="form-group">
              <label for="name">Full name</label>
              <input type="text" id="name" name="name" autocomplete="name" placeholder="e.g. Sara Ahmed">
              <p class="field-error" id="err-name"></p>
            </div>

            <div class="form-group">
              <label for="email">Email address</label>
              <input type="email" id="email" name="email" autocomplete="email" placeholder="you@example.com">
              <p class="field-error" id="err-email"></p>
            </div>

            <div class="form-group">
              <label for="phone">Phone number</label>
              <input type="tel" id="phone" name="phone" autocomplete="tel" placeholder="+20 1xx xxx xxxx">
              <p class="field-error" id="err-phone"></p>
            </div>

            <hr class="section-divider">

            <h4 class="form-section-title">Change password <span style="text-transform:none; letter-spacing:0;">(optional)</span></h4>

            <div class="form-group">
              <label for="password">New password</label>
              <input type="password" id="password" name="password" autocomplete="new-password" placeholder="Min. 8 characters">
              <p class="field-error" id="err-password"></p>
            </div>

            <div class="form-group">
              <label for="password_confirmation">Confirm new password</label>
              <input type="password" id="password_confirmation" name="password_confirmation" autocomplete="new-password" placeholder="Repeat the new password">
              <p class="field-error" id="err-password_confirmation"></p>
            </div>

            <div class="profile-actions">
              <button type="submit" id="save-btn" class="btn-primary"><i class="fas fa-save"></i> Save changes</button>
              <button type="button" id="reset-btn" class="btn-outline">Discard</button>
            </div>
          </form>
        </section>
      </div>
    </main>
  </div>

  <!-- Toast banners -->
  <div id="site-banner" role="status">
    <span id="site-banner-msg"></span><span id="site-banner-drain" aria-hidden="true"></span>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/animations.js"></script>
  <script src="assets/js/session.js"></script>
  <script src="assets/js/profile.js"></script>
</body>
</html>
