<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in · Itinari</title>
  <link rel="stylesheet" href="assets/css/auth.css" />
</head>
<body data-page="login">
  <main class="auth-shell">
    <section class="auth-visual">
      <div class="brand">Itinari</div>
      <div>
        <h1>Welcome back.</h1>
        <p>Discover places the locals love, from people who call them home.</p>
      </div>
    </section>

    <section class="auth-form-side">
      <div class="auth-card">
        <h2>Log in</h2>
        <p class="sub">Use your Itinari account to continue.</p>

        <form id="auth-form" novalidate>
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" />
            <p class="field-hint" id="hint-email" role="alert"></p>
          </div>

          <div class="field">
            <label for="password">Password</label>
            <div class="input-wrap">
              <input id="password" name="password" type="password" autocomplete="current-password" placeholder="********" />
              <button type="button" class="pw-toggle" data-pw-toggle aria-label="Show password" aria-pressed="false">👁</button>
            </div>
            <p class="field-hint" id="hint-password" role="alert"></p>
          </div>

          <button type="submit" class="btn-primary">
            <span class="spinner"></span>
            <span class="btn-label">Log in</span>
          </button>

          <div class="success-note" id="li-success-note"></div>
        </form>

        <div class="auth-links">
          No account? <a href="register.html">Create one</a>
          <span class="sep">·</span>
          <a href="forgot.html">Forgot password?</a>
        </div>
      </div>
    </section>
  </main>

  <div id="site-banner" role="status">
    <span id="site-banner-msg"></span><span id="site-banner-drain" aria-hidden="true"></span>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="assets/js/config.js?v=1786177602"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/validation.js"></script>
  <script src="assets/js/animations.js"></script>
  <script src="assets/js/session.js"></script>
  <script src="assets/js/password-toggle.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
